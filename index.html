    const STORAGE_KEY = 'gv_student_app_v6_master';
    const IDB_NAME = 'GV_StudentManagement_LargeDB_v2';
    const IDB_STORE = 'workspace_store';
    const IDB_RECORD_KEY = 'primary_state';

    const loadSavedStateSync = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.archiveByYear) {
          return parsed;
        }
      } catch (e) {
        console.error('Lỗi đọc dữ liệu đồng bộ:', e);
      }
      return null;
    };

    const openLargeDatabase = () => {
      return new Promise((resolve, reject) => {
        if (typeof window === 'undefined' || !window.indexedDB) {
          resolve(null);
          return;
        }
        const request = window.indexedDB.open(IDB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveToLargeIndexedDB = async (payload) => {
      try {
        const db = await openLargeDatabase();
        if (!db) return false;
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          store.put(payload, IDB_RECORD_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeIndexedDB = async () => {
      try {
        const db = await openLargeDatabase();
        if (!db) return null;
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const req = store.get(IDB_RECORD_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    };

    // Tính ĐTB môn học chuẩn Thông tư 22
    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);

      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;

      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;

      if (hasGK) {
        totalScore += gk * 2;
        totalWeight += 2;
      }
      if (hasCK) {
        totalScore += ck * 3;
        totalWeight += 3;
      }

      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

        const rec = getStudentWeekRecord(stuId, weekNum);

        let totalAbsentP = 0;
        let totalAbsentK = 0;
        let totalLate = 0;

              if (code === 'M') totalLate += 1;
              if (typeObj.points > 0) totalPlus += 1;

        else if (clamped < 80) rank = 'Đạt';

          absentK += wSummary.totalAbsentK;
          late += wSummary.totalLate;
          plusCount += wSummary.totalPlus;

          trackedWeeks += 1;

          id: generatedInternalId,

          name: studentModal.name.trim(),
          dob: studentModal.dob.trim() || '01/01/2011',
          gender: studentModal.gender || 'Nam',
          status: studentModal.status || 'Đang học',
          vocational: studentModal.vocational || 'Chưa phân nghề',
          role: studentModal.role || 'Thành viên',
          attitude: studentModal.attitude || 'Tích cực',
          team: Number(studentModal.team) || 1,
          seat: Number(studentModal.seat) || currentStudents.length + 1,
          deskSlot: studentModal.deskSlot || '',
          studentPhone: (studentModal.studentPhone || '').trim(),
          parentPhone: (studentModal.parentPhone || '').trim(),
          gvcnComment: studentModal.gvcnComment || '',
        };

        if (studentModal.mode === 'ADD') {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: [...(prev[activeClass] || []), stuData],
          }));
          showToast(`Đã thêm học sinh ${stuData.name} và tự động lưu.`);
        } else {
          setStudentsByClass((prev) => ({
            ...prev,
            [activeClass]: (prev[activeClass] || []).map((s) =>
              s.id === studentModal.originalId ? stuData : s
            ),
          }));
          showToast(`Đã cập nhật hồ sơ học sinh ${stuData.name}.`);
        }
        setStudentModal(null);
      };

      const handleDeleteStudent = (stuId) => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).filter((s) => s.id !== stuId),
        }));
        showToast('Đã xóa học sinh khỏi danh sách lớp.');
      };

      const handleAddClass = (e) => {
        e.preventDefault();
        const raw = newClassName.trim();
        if (!raw) return;
        const id = raw.replace(/\s+/g, '').toUpperCase();
        if (classes.some((c) => c.id === id)) {
          showToast('Mã lớp này đã tồn tại!');
          return;
        }
        setClasses((prev) => [...prev, { id, name: raw.startsWith('Lớp') ? raw : `Lớp ${raw}` }]);
        setStudentsByClass((prev) => ({ ...prev, [id]: [] }));
        setClassSubjects((prev) => ({
          ...prev,
          [id]: [mainSubject, 'Toán', 'Ngữ văn', 'Tiếng Anh'],
        }));
        setActiveClass(id);
        setNewClassName('');
        setNewClassModalOpen(false);
        showToast(`Đã tạo lớp mới: ${raw}`);
      };

      const handleDeleteClass = (classId) => {
        if (classes.length <= 1) {
          showToast('Cần giữ lại ít nhất 1 lớp học trong hệ thống.');
          return;
        }
        const nextClasses = classes.filter((c) => c.id !== classId);
        setClasses(nextClasses);
        if (activeClass === classId) {
          setActiveClass(nextClasses[0].id);
        }
        showToast(`Đã xóa lớp ${classId}.`);
      };

      const handleAddSubjectToClass = (e) => {
        e.preventDefault();
        const name = newSubjectName.trim();
        if (!name) return;
        if (currentSubjects.includes(name)) {
          showToast('Môn học này đã có trong lớp!');
          return;
        }
        setClassSubjects((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), name],
        }));
        setSelectedSubject(name);
        setNewSubjectName('');
        showToast(`Đã thêm môn ${name} cho ${currentClassObj.name}.`);
      };

      const handleRemoveSubjectFromClass = (subjName) => {
        if (currentSubjects.length <= 1) {
          showToast('Lớp phải có ít nhất 1 môn học.');
          return;
        }
        const updated = currentSubjects.filter((s) => s !== subjName);
        setClassSubjects((prev) => ({
          ...prev,
          [activeClass]: updated,
        }));
        setSelectedSubject(updated[0]);
        showToast(`Đã xóa môn ${subjName} khỏi ${currentClassObj.name}.`);
      };

      const handleGradeChange = (stuId, field, value) => {
        setGrades((prev) => {
          const classGrades = prev[activeClass] || {};
          const semGrades = classGrades[semester] || {};
          const subjGrades = semGrades[selectedSubject] || {};
          const stuGrades = subjGrades[stuId] || {
            tx1: '',
            tx2: '',
            tx3: '',
            tx4: '',
            gk: '',
            ck: '',
            comment: '',
          };

          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: {
                ...semGrades,
                [selectedSubject]: {
                  ...subjGrades,
                  [stuId]: {
                    ...stuGrades,
                    [field]: value,
                  },
                },
              },
            },
          };
        });
      };

      const toggleAttendanceCode = (stuId, dayKey, codeId) => {
        setAttendance((prev) => {
          const classAtt = prev[activeClass] || {};
          const weekAtt = classAtt[selectedWeek] || {};
          const stuAtt = weekAtt[stuId] || {};
          const currentCodes = stuAtt[dayKey] || [];

          const exists = currentCodes.includes(codeId);
          const nextCodes = exists
            ? currentCodes.filter((c) => c !== codeId)
            : [...currentCodes, codeId];

          return {
            ...prev,
            [activeClass]: {
              ...classAtt,
              [selectedWeek]: {
                ...weekAtt,
                [stuId]: {
                  ...stuAtt,
                  [dayKey]: nextCodes,
                },
              },
            },
          };
        });
      };

      const clearWeekAttendance = () => {
        setAttendance((prev) => ({
          ...prev,
          [activeClass]: {
            ...(prev[activeClass] || {}),
            [selectedWeek]: {},
          },
        }));
        showToast(`Đã đặt toàn bộ học sinh Tuần ${selectedWeek} về trạng thái Có mặt đủ (100đ).`);
      };

      // Nhập học sinh hoặc cập nhật Mã định danh Bộ / Tình trạng / Học nghề từ Excel
      const handleProcessExcelPaste = () => {
        const lines = excelPasteText
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);
        if (lines.length === 0) return;

        if (excelImportMode === 'UPDATE_MOET_ID') {
          setStudentsByClass((prev) => {
            const list = [...(prev[activeClass] || [])];
            lines.forEach((line, idx) => {
              const cols = line.includes('\t') ? line.split('\t') : line.split(',');
              const clean = cols.map((c) => c.trim());
              if (list[idx]) {
                list[idx] = {
                  ...list[idx],
                  moetId: clean[0] || list[idx].moetId || list[idx].id,
                  status: clean[1] || list[idx].status || 'Đang học',
                  vocational: clean[2] || list[idx].vocational || 'Chưa phân nghề',
                };
              }
            });
            return { ...prev, [activeClass]: list };
          });
          setExcelPasteText('');
          setExcelImportModalOpen(false);
          showToast(
            `Đã cập nhật Mã định danh Bộ / Tình trạng / Học nghề từ Excel cho lớp ${activeClass}!`
          );
          return;
        }

        const added = lines.map((line, idx) => {
          const cols = line.includes('\t') ? line.split('\t') : line.split(',');
          const clean = cols.map((c) => c.trim());
          // Thứ tự cột: Mã định danh Bộ | Họ tên | Ngày sinh | Giới tính | Tình trạng | Học nghề | Chức vụ | Thái độ | SĐT HS | SĐT PH
          const hasMoetFirst =
            clean.length >= 2 &&
            /^[0-9A-Za-z_-]{4,}$/.test(clean[0]) &&
            !clean[0].includes(' ');

          const moetId = hasMoetFirst
            ? clean[0]
            : `072211${String(currentStudents.length + idx + 1).padStart(6, '0')}`;
          const offset = hasMoetFirst ? 1 : 0;

          return {
            id: `HS${Date.now().toString().slice(-4)}${idx}`,
            moetId,
            name: clean[0 + offset] || `Học sinh ${currentStudents.length + idx + 1}`,
            dob: clean[1 + offset] || '01/01/2011',
            gender: clean[2 + offset] || 'Nam',
            status: clean[3 + offset] || 'Đang học',
            vocational: clean[4 + offset] || 'Chưa phân nghề',
            role: clean[5 + offset] || 'Thành viên',
            attitude: clean[6 + offset] || 'Tích cực',
            team: ((currentStudents.length + idx) % 4) + 1,
            seat: currentStudents.length + idx + 1,
            deskSlot: '',
            studentPhone: clean[7 + offset] || '',
            parentPhone: clean[8 + offset] || '',
            gvcnComment: '',
          };
        });

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), ...added],
        }));
        setExcelPasteText('');
        setExcelImportModalOpen(false);
        showToast(
          `Đã nhập thành công ${added.length} học sinh từ Excel vào ${currentClassObj.name}.`
        );
      };

      const handleUploadExcelCSVFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const content = String(evt.target.result || '');
          setExcelPasteText(content);
          showToast('Đã đọc nội dung file! Vui lòng kiểm tra và bấm nút Nhập vào lớp.');
        };
        reader.readAsText(file);
      };

      // Sắp xếp học sinh vào từng vị trí ghế của Bàn học
      const handleAssignStudentToSeatSlot = (slotKey, colNum, targetStudentId) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (!targetStudentId) {
              return s.deskSlot === slotKey ? { ...s, deskSlot: '' } : s;
            }
            if (s.id === targetStudentId) {
              return { ...s, deskSlot: slotKey, team: colNum };
            }
            if (s.deskSlot === slotKey) {
              return { ...s, deskSlot: '' };
            }
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
      };

      const handleSwapTwoDeskSlots = (slotA, colA, slotB, colB) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (s.deskSlot === slotA) return { ...s, deskSlot: slotB, team: colB };
            if (s.deskSlot === slotB) return { ...s, deskSlot: slotA, team: colA };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã đổi chỗ ngồi giữa vị trí ${slotA} và ${slotB}!`);
      };

      const handleAutoArrangeDesks = () => {
        const { cols, desksPerCol, seatsPerDesk } = seatLayoutConfig;
        const slots = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            for (let s = 1; s <= seatsPerDesk; s++) {
              slots.push({ slotKey: `${c}-${r}-${s}`, col: c });
            }
          }
        }
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((stu, idx) => {
            const target = slots[idx];
            return target
              ? { ...stu, deskSlot: target.slotKey, team: target.col }
              : { ...stu, deskSlot: '' };
          });
          return { ...prev, [activeClass]: list };
        });
        showToast('Đã tự động xếp học sinh vào các bàn học!');
      };

      const handleClearAllDesks = () => {
        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: (prev[activeClass] || []).map((s) => ({ ...s, deskSlot: '' })),
        }));
        showToast('Đã làm trống sơ đồ bàn học để bạn xếp lại từ đầu.');
      };

      const handleProcessGradePaste = () => {
        const lines = gradePasteText
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);
        if (lines.length === 0) return;

        setGrades((prev) => {
          const classGrades = { ...(prev[activeClass] || {}) };
          const semGrades = { ...(classGrades[semester] || {}) };
          const subjGrades = { ...(semGrades[selectedSubject] || {}) };

          currentStudents.forEach((stu, idx) => {
            if (!lines[idx]) return;
            const cols = lines[idx].includes('\t')
              ? lines[idx].split('\t')
              : lines[idx].split(',');
            const clean = cols.map((c) => c.trim());
            const existing = subjGrades[stu.id] || {};
            subjGrades[stu.id] = {
              ...existing,
              tx1: clean[0] ?? existing.tx1 ?? '',
              tx2: clean[1] ?? existing.tx2 ?? '',
              tx3: clean[2] ?? existing.tx3 ?? '',
              tx4: clean[3] ?? existing.tx4 ?? '',
              gk: clean[4] ?? existing.gk ?? '',
              ck: clean[5] ?? existing.ck ?? '',
              comment: clean[6] ?? existing.comment ?? '',
            };
          });

          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: {
                ...semGrades,
                [selectedSubject]: subjGrades,
              },
            },
          };
        });

        setGradePasteText('');
        setGradePasteModalOpen(false);
        showToast(`Đã dán điểm môn ${selectedSubject} (${semester}) cho danh sách lớp.`);
      };

      const exportClassCSV = () => {
        const headers = [
          'Mã định danh Bộ',
          'Họ và tên',
          'Ngày sinh',
          'Giới tính',
          'Tình trạng',
          'Học nghề',
          'Chức vụ',
          'Thái độ học tập',
          'Tổ',
          'Vị trí bàn',
          'SĐT Học sinh',
          'SĐT Phụ huynh',
          `Điểm Chuyên cần Tuần ${selectedWeek}`,
          ...currentSubjects.map((s) => `ĐTB ${s} (${semester})`),
          'ĐTB Chung',
          'Nhận xét GVCN',
        ];

        const rows = currentStudents.map((stu) => {
          const cond = calculateWeeklyConductScore(stu.id);
          const subjScores = currentSubjects.map((subj) => {
            const avg = calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? avg : '';
          });
          const gpa = getStudentOverallGPA(stu.id, 'SEMESTER') ?? '';
          return [
            `'${stu.moetId || stu.id}`,
            `"${stu.name}"`,
            stu.dob,
            stu.gender,
            `"${stu.status || 'Đang học'}"`,
            `"${stu.vocational || 'Chưa phân nghề'}"`,
            `"${stu.role}"`,
            `"${stu.attitude}"`,
            stu.team,
            `"${stu.deskSlot || ''}"`,
            `'${stu.studentPhone}`,
            `'${stu.parentPhone}`,
            cond.score,
            ...subjScores,
            gpa,
            `"${(stu.gvcnComment || '').replace(/"/g, '""')}"`,
          ].join(',');
        });

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Danh_Sach_Diem_${activeClass}_${schoolYear.replace(/\s+/g, '')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Đã tải xuống file Excel/CSV của lớp ${activeClass}.`);
      };

      // ============================================================================
      // TRỢ LÝ AI ĐÁNH GIÁ & NHẬN XÉT HỌC SINH
      // ============================================================================
      const buildSmartPedagogicalComment = (stu, tone = aiTone, targetMode = aiTargetMode) => {
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa =
          targetMode === 'GVCN_YEAR'
            ? getStudentOverallGPA(stu.id, summaryPeriodMode)
            : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));

        const rolePart =
          stu.role && stu.role !== 'Thành viên'
            ? `Trên cương vị ${stu.role}, em luôn gương mẫu và trách nhiệm với tập thể. `
            : '';

        const vocPart =
          stu.vocational && stu.vocational !== 'Chưa phân nghề'
            ? `Định hướng nghề ${stu.vocational} nghiêm túc. `
            : '';

        let attitudePart = '';
        if (stu.attitude === 'Rất tích cực' || stu.attitude === 'Tích cực') {
          attitudePart =
            'Trong giờ học, em có thái độ học tập sôi nổi, hăng hái phát biểu xây dựng bài';
        } else if (stu.attitude === 'Chăm chỉ' || stu.attitude === 'Khá chú ý') {
          attitudePart =
            'Em có ý thức học tập nghiêm túc, ghi chép bài đầy đủ và lắng nghe giảng bài';
        } else {
          attitudePart =
            'Em cần tập trung chú ý hơn trên lớp và chủ động hơn trong việc hoàn thành bài tập';
        }

        let conductPart = '';
        if (yearCond.absentK === 0 && yearCond.late === 0) {
          conductPart = `, chuyên cần đạt ${yearCond.avgConductScore}đ (${yearCond.yearConductRank}, đi học đúng giờ, đầy đủ). `;
        } else {
          conductPart = `, điểm chuyên cần đạt ${yearCond.avgConductScore}đ (vắng ${yearCond.absentP}P/${yearCond.absentK}K, đi muộn ${yearCond.late} lần - cần khắc phục để đi học chuyên cần hơn). `;
        }

        let scorePart = '';
        if (gpa !== null) {
          if (gpa >= 8.0) {
            scorePart = `Kết quả học tập đạt mức Tốt (ĐTB ${gpa}), nắm vững kiến thức trọng tâm và vận dụng linh hoạt.`;
          } else if (gpa >= 6.5) {
            scorePart = `Kết quả học tập đạt mức Khá (ĐTB ${gpa}), nắm được kiến thức cơ bản nhưng cần rèn thêm kỹ năng giải bài tập nâng cao.`;
          } else if (gpa >= 5.0) {
            scorePart = `Kết quả học tập đạt mức Đạt (ĐTB ${gpa}), cần dành thêm thời gian ôn luyện ở nhà để cải thiện điểm số.`;
          } else {
            scorePart = `Kết quả học tập hiện ở mức ${gpa}, thầy/cô và gia đình cần phối hợp sát sao hơn để hỗ trợ em củng cố kiến thức căn bản.`;
          }
        } else {
          scorePart = 'Đang cập nhật tiến độ điểm đánh giá định kỳ.';
        }

        if (tone === 'FORMAL_TT22') {
          return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart}`;
        }
        if (tone === 'DETAILED_PARENT') {
          return `Kính gửi Phụ huynh em ${stu.name}: ${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Rất mong gia đình tiếp tục đồng hành, khích lệ em phát huy trong giai đoạn tới.`;
        }
        return `${rolePart}${vocPart}${attitudePart}${conductPart}${scorePart} Chúc em luôn giữ vững sự tự tin và bứt phá mạnh mẽ hơn nữa!`;
      };

      const handleGenerateAICommentForStudent = (stu) => {
        const comment = buildSmartPedagogicalComment(stu, aiTone, aiTargetMode);
        if (aiTargetMode === 'GVCN_YEAR') {
          handleUpdateStudentFieldInline(stu.id, 'gvcnComment', comment);
        } else {
          handleGradeChange(stu.id, 'comment', comment);
        }
        showToast(`Đã tạo nhận xét AI cho học sinh ${stu.name}.`);
      };

      const handleGenerateAICommentsForAll = () => {
        setAiGenerating(true);
        setTimeout(() => {
          if (aiTargetMode === 'GVCN_YEAR') {
            setStudentsByClass((prev) => ({
              ...prev,
              [activeClass]: (prev[activeClass] || []).map((stu) => ({
                ...stu,
                gvcnComment: buildSmartPedagogicalComment(stu, aiTone, 'GVCN_YEAR'),
              })),
            }));
          } else {
            currentStudents.forEach((stu) => {
              const cmt = buildSmartPedagogicalComment(stu, aiTone, 'SUBJECT_COMMENT');
              handleGradeChange(stu.id, 'comment', cmt);
            });
          }
          setAiGenerating(false);
          setAiModalOpen(false);
          showToast(
            `Đã tạo nhận xét AI cho toàn bộ ${currentStudents.length} học sinh lớp ${activeClass}!`
          );
        }, 300);
      };

      const handleCopyZaloReport = (stu) => {
        const cond = calculateWeeklyConductScore(stu.id);
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);

        const subjectLines = currentSubjects
          .map((subj) => {
            const avg =
              summaryPeriodMode === 'WHOLE_YEAR'
                ? getSubjectWholeYearAvg(stu.id, subj)
                : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? `${subj}: ${avg}` : null;
          })
          .filter(Boolean)
          .join(' | ');

        const text = [
          `[THÔNG BÁO TÌNH HÌNH HỌC TẬP - ${schoolName.toUpperCase()}]`,
          `- Học sinh: ${stu.name} (Mã ĐD Bộ: ${stu.moetId || stu.id} - ${currentClassObj.name})`,
          `- Tình trạng: ${stu.status || 'Đang học'} | Học nghề: ${stu.vocational || 'Chưa phân nghề'}`,
          `- Chức vụ: ${stu.role} | Thái độ học tập: ${stu.attitude}`,
          `- Điểm chuyên cần Tuần ${selectedWeek}: ${cond.score}/100đ (Xếp loại: ${cond.rank})`,
          `- Tổng hợp chuyên cần năm: Vắng ${yearCond.absentP}P/${yearCond.absentK}K, Đi muộn ${yearCond.late} lần`,
          `- Điểm TB các môn: ${subjectLines || 'Đang cập nhật'}`,
          `- Điểm TB chung: ${gpa ?? '--'} (${classifyAcademicRank(gpa)})`,
          `- Nhận xét của GV: ${stu.gvcnComment || buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}`,
          `Trân trọng cảm ơn Quý Phụ huynh (${stu.parentPhone || 'SĐT PH'}) đã phối hợp cùng giáo viên (${teacherName})!`,
        ].join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        showToast(`Đã copy báo cáo Zalo của HS ${stu.name}! Bạn chỉ cần dán (Cmd+V) vào Zalo.`);
      };

      const promoteClassCode = (code) => {
        return code.replace(/^(\d+)/, (m) => String(Number(m) + 1));
      };

      const handleCreateNewSchoolYear = (e) => {
        e.preventDefault();
        const yName = newYearName.trim();
        if (!yName) return;
        if (archiveByYear[yName]) {
          setSchoolYear(yName);
          setYearModalOpen(false);
          showToast(`Đã chuyển sang năm học ${yName}.`);
          return;
        }

        if (promoteClassesMode) {
          const nextClasses = classes.map((c) => {
            const nextId = promoteClassCode(c.id);
            return { id: nextId, name: `Lớp ${nextId}` };
          });
          const nextHomeroom = promoteClassCode(homeroomClassId);
          const nextStudents = {};
          const nextSubjects = {};

          classes.forEach((c) => {
            const nextId = promoteClassCode(c.id);
            nextStudents[nextId] = (studentsByClass[c.id] || []).map((s) => ({
              ...s,
              gvcnComment: '',
            }));
            nextSubjects[nextId] = [...(classSubjects[c.id] || [mainSubject])];
          });

          setArchiveByYear((prev) => ({
            ...prev,
            [yName]: {
              homeroomClassId: nextHomeroom,
              classes: nextClasses,
              classSubjects: nextSubjects,
              studentsByClass: nextStudents,
              grades: {},
              attendance: {},
              checklistsByClass: {},
            },
          }));
          setSchoolYear(yName);
          setActiveClass(nextClasses[0]?.id || '');
          showToast(`Đã tạo năm học ${yName} và tự động lên lớp cho toàn bộ học sinh!`);
        } else {
          setArchiveByYear((prev) => ({
            ...prev,
            [yName]: buildDefaultArchive()['2026 - 2027'],
          }));
          setSchoolYear(yName);
          showToast(`Đã tạo năm học mới ${yName}.`);
        }
        setYearModalOpen(false);
      };

      const handlePickRandomStudent = () => {
        if (currentStudents.length === 0) return;
        let pool = currentStudents.filter((s) => !pickedHistoryIds.includes(s.id));
        if (pool.length === 0) {
          pool = [...currentStudents];
          setPickedHistoryIds([]);
        }

        if (prioritizePassive) {
          const weighted = [];
          pool.forEach((s) => {
            const weight =
              s.attitude === 'Còn thụ động' || s.attitude === 'Cần nhắc nhở' ? 3 : 1;
            for (let i = 0; i < weight; i++) weighted.push(s);
          });
          const chosen = weighted[Math.floor(Math.random() * weighted.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        } else {
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        }
      };

      const handleGenerateBalancedGroups = () => {
        const count = Math.max(2, Math.min(8, Number(groupCount) || 4));
        const sorted = [...currentStudents].sort((a, b) => {
          const gpaA =
            calculateSubjectAverage(getStudentSubjectScoreObj(a.id, selectedSubject, semester)) ??
            getStudentOverallGPA(a.id, 'SEMESTER') ??
            6.5;
          const gpaB =
            calculateSubjectAverage(getStudentSubjectScoreObj(b.id, selectedSubject, semester)) ??
            getStudentOverallGPA(b.id, 'SEMESTER') ??
            6.5;
          return gpaB - gpaA;
        });

        const buckets = Array.from({ length: count }, (_, idx) => ({
          id: idx + 1,
          name: `Nhóm Thực hành ${idx + 1}`,
          members: [],
        }));

        sorted.forEach((stu, idx) => {
          const bucketIdx = idx % count;
          buckets[bucketIdx].members.push({
            ...stu,
            isLeader: buckets[bucketIdx].members.length === 0,
            score:
              calculateSubjectAverage(
                getStudentSubjectScoreObj(stu.id, selectedSubject, semester)
              ) ?? getStudentOverallGPA(stu.id, 'SEMESTER'),
          });
        });

        setGeneratedGroups(buckets);

      const handleDownloadBackupJSON = () => {
        const payload = {
          schoolName,
          semester,
          teacherName,
          mainSubject,
          schoolYear,
          archiveByYear,
          attendanceTypes,
          seatLayoutConfig,
          exportedAt: new Date().toISOString(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: 'application/json;charset=utf-8;',
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SaoLuu_QuanLyHS_${teacherName.replace(/\s+/g, '_')}_${schoolYear.replace(/\s+/g, '')}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Đã tải file Sao lưu (.JSON) về máy tính!');
      };

        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && parsed.archiveByYear) {
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.semester) setSemester(parsed.semester);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.mainSubject) setMainSubject(parsed.mainSubject);
              if (parsed.schoolYear) setSchoolYear(parsed.schoolYear);
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.attendanceTypes) setAttendanceTypes(parsed.attendanceTypes);
              if (parsed.seatLayoutConfig) setSeatLayoutConfig(parsed.seatLayoutConfig);
              setBackupModalOpen(false);
              showToast('Đã khôi phục toàn bộ dữ liệu từ file .JSON thành công!');
            } else {
              showToast('File không đúng định dạng sao lưu.');
            }
          } catch (err) {
            showToast('Không thể đọc file JSON. Vui lòng kiểm tra lại.');
          }
        };
        reader.readAsText(file);

      const handlePushToGitHubGist = async () => {
        if (!githubToken.trim()) {
          showToast('Vui lòng nhập GitHub Personal Access Token (quyền gist) trước.');
          return;
        }
        setCloudSyncLoading(true);
        try {
          const payload = {
            schoolName,
            semester,
            teacherName,
            mainSubject,
            schoolYear,
            archiveByYear,
            attendanceTypes,
            seatLayoutConfig,
            updatedAt: Date.now(),
          };
          const body = {
            description: `Dữ liệu Sổ Quản Lý Học Sinh - GV ${teacherName}`,
            public: false,
            files: {
              'gv_student_management_backup.json': {
                content: JSON.stringify(payload, null, 2),
              },
            },
          };

          const url = githubGistId.trim()
            ? `https://api.github.com/gists/${githubGistId.trim()}`
            : 'https://api.github.com/gists';
          const method = githubGistId.trim() ? 'PATCH' : 'POST';

          const res = await fetch(url, {
            method,
            headers: {
              Authorization: `token ${githubToken.trim()}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(body),
          });

          if (!res.ok) throw new Error('GitHub API Error');
          const data = await res.json();
          if (data.id) {
            setGithubGistId(data.id);
            showToast(`Đã đồng bộ lên GitHub Cloud thành công! Mã Gist: ${data.id}`);
          }
        } catch (err) {
          showToast('Lỗi đồng bộ GitHub Gist. Hãy kiểm tra lại Token (cần bật quyền "gist").');
        } finally {
          setCloudSyncLoading(false);
        }
      };

                  <div
                    key={stu.id}
                    className={`p-8 max-w-4xl mx-auto ${
                      idx < studentsToPrint.length - 1 ? 'page-break' : ''
                    }`}
                  >
                    <div className="flex justify-between items-start border-b-2 border-black pb-3 mb-4">
                      <div>
                        <div className="text-xs font-bold uppercase">{schoolName}</div>
                        <div className="text-xs mt-0.5">
                          Lớp: <strong>{currentClassObj.name}</strong> • Năm học: <strong>{schoolYear}</strong>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="text-xs uppercase font-semibold">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                        <div className="text-[10px] italic">Độc lập - Tự do - Hạnh phúc</div>
                      </div>
                    </div>

                    <div className="text-center my-3">
                      <div className="text-base font-bold uppercase tracking-wide">
                        PHIẾU THÔNG BÁO NỀ NẾP & VI PHẠM KỶ LUẬT TUẦN {selectedWeek}
                      </div>
                      <div className="text-xs italic text-gray-700 mt-0.5">
                        (Từ Thứ Hai đến Chủ Nhật - {semester})
                      </div>
                    </div>

                    {/* Thông tin học sinh */}
                    <div className="grid grid-cols-3 gap-2 text-xs border border-black p-3 mb-4">
                      <div>
                        Họ và tên: <strong>{stu.name}</strong>
                      </div>
                      <div>
                        Mã định danh Bộ: <strong>{stu.moetId || stu.id}</strong>
                      </div>
                      <div>
                        Ngày sinh: <strong>{stu.dob}</strong> ({stu.gender})
                      </div>
                      <div>
                        Tình trạng: <strong>{stu.status || 'Đang học'}</strong>
                      </div>
                      <div>
                        Học nghề: <strong>{stu.vocational || 'Chưa phân nghề'}</strong>
                      </div>
                      <div>
                        Chức vụ lớp: <strong>{stu.role}</strong>
                      </div>
                      <div>
                        Thái độ học tập: <strong>{stu.attitude}</strong>
                      </div>
                      <div>
                        SĐT Học sinh: <strong>{stu.studentPhone || '--'}</strong>
                      </div>
                      <div>
                        SĐT Phụ huynh: <strong>{stu.parentPhone || '--'}</strong>
                      </div>
                    </div>

                    {/* I. Bảng ghi nhận nề nếp 7 ngày trong tuần */}
                    <div className="mb-4">
                      <div className="text-xs font-bold uppercase mb-1.5">
                        I. Bảng theo dõi nề nếp từng ngày trong Tuần {selectedWeek} (Thứ 2 - Chủ nhật)
                      </div>
                      <table className="w-full border-collapse border border-black text-xs">
                        <thead>
                          <tr className="bg-gray-100">
                            <th className="border border-black py-1.5 px-2 text-center w-28">Thứ / Ngày</th>
                            <th className="border border-black py-1.5 px-3 text-left">Lỗi vi phạm / Khen thưởng ghi nhận</th>
                            <th className="border border-black py-1.5 px-2 text-center w-24">Điểm cộng/trừ</th>
                            <th className="border border-black py-1.5 px-2 text-center w-28">Đánh giá ngày</th>
                          </tr>
                        </thead>
                        <tbody>
                          {DAYS_OF_WEEK.map((d) => {
                            const codes = weekRec[d.key] || [];
                            let dayPts = 0;
                            const details = codes.map((c) => {
                              const t = attendanceTypes.find((x) => x.id === c);
                              const pts = Number(t?.points || 0);
                              dayPts += pts;
                              return `${t ? t.label : c} (${pts > 0 ? '+' : ''}${pts}đ)`;
                            });

                            return (
                              <tr key={d.key}>
                                <td className="border border-black py-1 px-2 text-center font-bold">
                                  {d.label}
                                </td>
                                <td className="border border-black py-1 px-3">
                                  {codes.length === 0 ? (
                                    <span className="text-gray-600 italic">
                                      Đi học đầy đủ, đúng giờ, chấp hành tốt nội quy.
                                    </span>
                                  ) : (
                                    <span className="font-semibold text-black">
                                      {details.join('; ')}
                                    </span>
                                  )}
                                </td>
                                <td className="border border-black py-1 px-2 text-center font-bold">
                                  {codes.length === 0 ? '0đ' : `${dayPts > 0 ? '+' : ''}${dayPts}đ`}
                                </td>
                                <td className="border border-black py-1 px-2 text-center font-semibold">
                                  {codes.length === 0 ? 'Tốt' : dayPts < 0 ? 'Có vi phạm' : 'Khen thưởng'}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    {/* II. Kết quả thi đua tuần */}
                    <div className="mb-4">
                      <div className="text-xs font-bold uppercase mb-1.5">
                        II. Kết quả thi đua & Chuyên cần Tuần {selectedWeek}
                      </div>
                      <div className="grid grid-cols-4 gap-2 text-xs border border-black p-2.5">
                        <div>
                          Điểm thi đua tuần:{' '}
                          <strong className="text-sm">
                            {weekCond.score} / 100đ
                          </strong>
                        </div>
                        <div>
                          Xếp loại tuần:{' '}
                          <strong>{weekCond.rank}</strong>
                        </div>
                        <div>
                          Số buổi nghỉ tuần:{' '}
                          <strong>
                            {weekCond.totalAbsentP} có phép / {weekCond.totalAbsentK} không phép
                          </strong>
                        </div>
                        <div>
                          Đi muộn / Khen thưởng:{' '}
                          <strong>
                            {weekCond.totalLate} lần muộn / {weekCond.totalPlus} khen
                          </strong>
                        </div>
                      </div>
                      <div className="mt-1.5 text-[11px] text-gray-700 italic">
                        * Lũy kế cả năm học: Đã vắng {yearCond.absentP} buổi có phép, {yearCond.absentK} buổi không phép, {yearCond.late} lần đi muộn. Điểm rèn luyện TB cả năm: {yearCond.avgConductScore}đ ({yearCond.yearConductRank}).
                      </div>
                    </div>

                    {/* III. Nhận xét của GVCN */}
                    <div className="border border-black p-3 text-xs mb-5">
                      <div className="font-bold uppercase mb-1">
                        III. Nhận xét của Giáo viên Chủ nhiệm & Nội dung cần phối hợp:
                      </div>
                      <p className="leading-relaxed">
                        {violationList.length === 0
                          ? `Trong Tuần ${selectedWeek}, em ${stu.name} chấp hành xuất sắc nội quy trường lớp, không có vi phạm kỷ luật, thái độ học tập ${stu.attitude.toLowerCase()}. Nhà trường và GVCN biểu dương ý thức tự giác rèn luyện của em.`
                          : `Trong Tuần ${selectedWeek}, em ${stu.name} có các vi phạm cần lưu ý chấn chỉnh: ${violationList.map((v) => `${v.day} (${v.label})`).join(', ')}. Kính đề nghị Quý Phụ huynh sát sao đôn đốc, nhắc nhở em khắc phục ngay trong tuần tới.`}
                        {stu.gvcnComment ? ` Ghi chú thêm: ${stu.gvcnComment}` : ''}
                      </p>
                    </div>

                    {/* IV. Ý kiến phụ huynh và chữ ký */}
                    <div className="grid grid-cols-2 text-xs text-center pt-2">
                      <div className="text-left pr-4">
                        <div className="font-bold uppercase text-center">Ý KIẾN CỦA PHỤ HUYNH HỌC SINH</div>
                        <div className="text-[10px] italic text-center mb-2">
                          (Gia đình đã nắm bắt tình hình vi phạm/học tập của con em)
                        </div>
                        <div className="border-b border-dotted border-black pb-4 text-gray-400 italic">
                          Ý kiến phụ huynh: ....................................................................................................
                        </div>
                        <div className="border-b border-dotted border-black pb-4 text-gray-400 italic mt-2">
                          ............................................................................................................................................
                        </div>
                        <div className="text-center mt-3">
                          <div className="italic text-[11px]">Ngày ..... tháng ..... năm 202...</div>
                          <div className="font-bold mt-1">Chữ ký Phụ huynh học sinh</div>
                          <div className="text-[10px] italic text-gray-500 mt-8">(Ký và ghi rõ họ tên)</div>
                        </div>
                      </div>

                      <div>
                        <div className="italic text-[11px]">Ngày ..... tháng ..... năm 202...</div>
                        <div className="font-bold uppercase mt-1">GIÁO VIÊN CHỦ NHIỆM</div>
                        <div className="text-[10px] italic text-gray-500">(Ký và ghi rõ họ tên)</div>
                        <div className="mt-16 font-bold text-sm">{teacherName}</div>
                      </div>
                    </div>
                  </div>
                );
              })
            ) : (
              /* ==============================================================
                 2. PHIẾU THÔNG BÁO KẾT QUẢ HỌC TẬP & BẢNG ĐIỂM CÁC MÔN
                 Dành riêng cho kết quả điểm số KTĐG TX, Giữa kỳ, Cuối kỳ
              =============================================================== */
              studentsToPrint.map((stu, idx) => {
                const gpaSem = getStudentOverallGPA(stu.id, 'SEMESTER');
                const gpaYear = getStudentOverallGPA(stu.id, 'WHOLE_YEAR');
                const yearCond = calculateYearAttendanceSummary(stu.id);
                const honor = getHonorTitle(gpaYear, yearCond.yearConductRank);

                return (
                  <div
                    key={stu.id}
                    className={`p-8 max-w-4xl mx-auto ${
                      idx < studentsToPrint.length - 1 ? 'page-break' : ''
                    }`}
                  >
                    <div className="flex justify-between items-start border-b-2 border-black pb-4 mb-5">
                      <div>
                        <div className="text-xs font-bold uppercase">{schoolName}</div>
                        <div className="text-xs mt-0.5">
                          Năm học: <strong>{schoolYear}</strong> • {semester}
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="text-base font-bold uppercase">
                          PHIẾU THÔNG BÁO KẾT QUẢ HỌC TẬP (BẢNG ĐIỂM)
                        </div>
                        <div className="text-xs mt-0.5">
                          Lớp: <strong>{currentClassObj.name}</strong> • GV phụ trách:{' '}
                          <strong>{teacherName}</strong>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-xs border border-black p-3 mb-4">
                      <div>
                        Họ và tên: <strong>{stu.name}</strong>
                      </div>
                      <div>
                        Mã định danh Bộ: <strong>{stu.moetId || stu.id}</strong>
                      </div>
                      <div>
                        Ngày sinh: <strong>{stu.dob}</strong> ({stu.gender})
                      </div>
                      <div>
                        Tình trạng: <strong>{stu.status || 'Đang học'}</strong>
                      </div>
                      <div>
                        Học nghề: <strong>{stu.vocational || 'Chưa phân nghề'}</strong>
                      </div>
                      <div>
                        Chức vụ: <strong>{stu.role}</strong>
                      </div>
                      <div>
                        Thái độ học tập: <strong>{stu.attitude}</strong>
                      </div>
                      <div>
                        SĐT Phụ huynh: <strong>{stu.parentPhone || '--'}</strong>
                      </div>
                      <div>
                        Danh hiệu thi đua: <strong>{honor}</strong>
                      </div>
                    </div>

                    <div className="mb-4">
                      <div className="text-xs font-bold uppercase mb-1.5">
                        Bảng điểm Kiểm tra Đánh giá các môn học (Chuẩn CT GDPT 2018)
                      </div>
                      <table className="w-full border-collapse border border-black text-xs">
                        <thead>
                          <tr className="bg-gray-100">
                            <th className="border border-black py-1.5 px-2 text-left">Môn học</th>
                            <th className="border border-black py-1.5 px-2 text-center">TX1</th>
                            <th className="border border-black py-1.5 px-2 text-center">TX2</th>
                            <th className="border border-black py-1.5 px-2 text-center">TX3</th>
                            <th className="border border-black py-1.5 px-2 text-center">TX4</th>
                            <th className="border border-black py-1.5 px-2 text-center">Giữa kỳ</th>
                            <th className="border border-black py-1.5 px-2 text-center">Cuối kỳ</th>
                            <th className="border border-black py-1.5 px-2 text-center">
                              ĐTB {semester}
                            </th>
                            <th className="border border-black py-1.5 px-2 text-center">ĐTB Cả năm</th>
                            <th className="border border-black py-1.5 px-2 text-left">
                              Nhận xét của GVBM
                            </th>
                          </tr>
                        </thead>
                        <tbody>
                          {currentSubjects.map((subj) => {
                            const sc = getStudentSubjectScoreObj(stu.id, subj, semester);
                            const avgSem = calculateSubjectAverage(sc);
                            const avgYr = getSubjectWholeYearAvg(stu.id, subj);
                            return (
                              <tr key={subj}>
                                <td className="border border-black py-1.5 px-2 font-bold">{subj}</td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.tx1 || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.tx2 || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.tx3 || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.tx4 || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.gk || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center">
                                  {sc.ck || '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center font-bold">
                                  {avgSem ?? '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2 text-center font-bold">
                                  {avgYr ?? '-'}
                                </td>
                                <td className="border border-black py-1.5 px-2">
                                  {sc.comment || ''}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                      <div className="flex justify-between text-xs font-bold mt-2">
                        <span>
                          Điểm TB các môn ({semester}): {gpaSem ?? '--'} (
                          {classifyAcademicRank(gpaSem)})
                        </span>
                        <span>
                          Điểm TB Cả năm: {gpaYear ?? '--'} ({classifyAcademicRank(gpaYear)})
                        </span>
                      </div>
                    </div>

                    <div className="border border-black p-3 text-xs mb-6">
                      <div className="font-bold uppercase mb-1">
                        Nhận xét đánh giá học tập của Giáo viên & Khuyến nghị phối hợp:
                      </div>
                      <p className="leading-relaxed">
                        {stu.gvcnComment ||
                          buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}
                      </p>
                    </div>

                    <div className="grid grid-cols-2 text-xs text-center pt-2">
                      <div>
                        <div className="font-bold">Ý KIẾN CỦA PHỤ HUYNH HỌC SINH</div>
                        <div className="text-gray-500 italic mt-1">(Ký và ghi rõ họ tên)</div>
                      </div>
                      <div>
                        <div className="font-bold">GIÁO VIÊN PHỤ TRÁCH</div>
                        <div className="mt-12 font-bold">{teacherName}</div>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
