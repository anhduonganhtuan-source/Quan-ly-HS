    // Tính ngày tháng thực tế từ ngày Chủ nhật đầu tuần do giáo viên nhập (dd/mm hoặc dd/mm/yyyy)
    const computeDatesFromSundayInput = (sundayStr) => {
      if (!sundayStr || !sundayStr.trim()) return {};
      const parts = sundayStr.trim().split('/');
      if (parts.length < 2) return {};
      const d = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      const y = parts[2] ? parseInt(parts[2], 10) : new Date().getFullYear();
      const base = new Date(y, m, d);
      if (isNaN(base.getTime())) return {};

      const result = {};
      DAYS_OF_WEEK.forEach((dayObj, idx) => {
        const dt = new Date(base);
        dt.setDate(base.getDate() + idx);
        const dd = String(dt.getDate()).padStart(2, '0');
        const mm = String(dt.getMonth() + 1).padStart(2, '0');
        result[dayObj.key] = `${dd}/${mm}`;
      });
      return result;

    // ============================================================================
    // CƠ CHẾ LƯU TRỮ KÉP (INDEXEDDB + LOCALSTORAGE)
    // ============================================================================
    const STORAGE_KEY = 'gv_student_app_v7_portal';
    const IDB_NAME = 'GV_StudentManagement_Portal_v3';
    const IDB_STORE = 'workspace_store';
    const IDB_RECORD_KEY = 'primary_state';

    const loadSavedStateSync = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.archiveByYear) {
          return parsed;
        }
      } catch (e) {}
      return null;
    };

    const openLargeDatabase = () => {
      return new Promise((resolve) => {
        if (typeof window === 'undefined' || !window.indexedDB) {
          resolve(null);
          return;
        }
        const request = window.indexedDB.open(IDB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
    };

    const saveToLargeIndexedDB = async (payload) => {
      try {
        const db = await openLargeDatabase();
        if (!db) return false;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(payload, IDB_RECORD_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeIndexedDB = async () => {
      try {
        const db = await openLargeDatabase();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(IDB_RECORD_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    };

    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);
      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;
      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;
      if (hasGK) { totalScore += gk * 2; totalWeight += 2; }
      if (hasCK) { totalScore += ck * 3; totalWeight += 3; }
      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

      };

      const calculateWeeklyConductScore = (stuId, weekNum = selectedWeek) => {
        let score = 100;
        let totalAbsentP = 0;
        let totalAbsentK = 0;
        let totalLate = 0;
        let totalPlus = 0;

        DAYS_OF_WEEK.forEach((d) => {
          SESSIONS_OF_DAY.forEach((ses) => {
            const codes = getStudentDaySessionCodes(stuId, d.key, ses.key, weekNum);
            codes.forEach((code) => {
              const typeObj = attendanceTypes.find((t) => t.id === code);
              if (typeObj) {
                score += Number(typeObj.points || 0);
                if (code === 'P') totalAbsentP += 1;
                if (code === 'K') totalAbsentK += 1;
                if (code === 'M') totalLate += 1;
                if (typeObj.points > 0) totalPlus += 1;
              }
            });
          });
        });

        const clamped = Math.max(0, Math.min(120, score));
        let rank = 'Tốt';
        if (clamped < 65 || totalAbsentK >= 2) rank = 'Chưa đạt';
        else if (clamped < 80) rank = 'Đạt';
        else if (clamped < 90) rank = 'Khá';

        return { score: clamped, rank, totalAbsentP, totalAbsentK, totalLate, totalPlus };
      };

      const calculateYearAttendanceSummary = (stuId) => {
        const classAtt = attendance[activeClass] || {};
        let absentP = 0, absentK = 0, late = 0, plusCount = 0, totalScoreSum = 0, trackedWeeks = 0;

        Object.keys(classAtt).forEach((wKey) => {
          const wSummary = calculateWeeklyConductScore(stuId, Number(wKey));
          absentP += wSummary.totalAbsentP;
          absentK += wSummary.totalAbsentK;
          late += wSummary.totalLate;
          plusCount += wSummary.totalPlus;
          totalScoreSum += wSummary.score;
          trackedWeeks += 1;
        });

        const avgConductScore = trackedWeeks > 0 ? Math.round(totalScoreSum / trackedWeeks) : 100;
        let yearConductRank = 'Tốt';
        if (avgConductScore < 65 || absentK >= 5) yearConductRank = 'Chưa đạt';
        else if (avgConductScore < 80) yearConductRank = 'Đạt';
        else if (avgConductScore < 90) yearConductRank = 'Khá';

        return { absentP, absentK, late, plusCount, avgConductScore, yearConductRank };

          });
          setExcelPasteText('');
          setExcelImportModalOpen(false);
          showToast(`Đã cập nhật Mã định danh Bộ cho lớp ${activeClass}!`);
          return;
        }

        const added = lines.map((line, idx) => {
          const cols = line.includes('\t') ? line.split('\t') : line.split(',');
          const clean = cols.map((c) => c.trim());
          const hasMoetFirst = clean.length >= 2 && /^[0-9A-Za-z_-]{4,}$/.test(clean[0]) && !clean[0].includes(' ');
          const moetId = hasMoetFirst
            ? clean[0]
            : `072211${String(currentStudents.length + idx + 1).padStart(6, '0')}`;
          const offset = hasMoetFirst ? 1 : 0;

          return {
            id: `HS${Date.now().toString().slice(-4)}${idx}`,
            moetId,
            name: clean[0 + offset] || `Học sinh ${currentStudents.length + idx + 1}`,
            dob: clean[1 + offset] || '01/01/2011',
            gender: clean[2 + offset] || 'Nam',
            status: clean[3 + offset] || 'Đang học',
            vocational: clean[4 + offset] || 'Chưa phân nghề',
            role: clean[5 + offset] || 'Thành viên',
            attitude: clean[6 + offset] || 'Tích cực',
            team: ((currentStudents.length + idx) % 4) + 1,
            seat: currentStudents.length + idx + 1,
            deskSlot: '',
            studentPhone: clean[7 + offset] || '',
            parentPhone: clean[8 + offset] || '',
            gvcnComment: '',
          };
        });

        setStudentsByClass((prev) => ({
          ...prev,
          [activeClass]: [...(prev[activeClass] || []), ...added],
        }));
        setExcelPasteText('');
        setExcelImportModalOpen(false);
        showToast(`Đã nhập ${added.length} học sinh vào ${currentClassObj.name}.`);
      };

      const handleProcessGradePaste = () => {
        const lines = gradePasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        if (lines.length === 0) return;
        setGrades((prev) => {
          const classGrades = { ...(prev[activeClass] || {}) };
          const semGrades = { ...(classGrades[semester] || {}) };
          const subjGrades = { ...(semGrades[selectedSubject] || {}) };

          currentStudents.forEach((stu, idx) => {
            if (!lines[idx]) return;
            const cols = lines[idx].includes('\t') ? lines[idx].split('\t') : lines[idx].split(',');
            const clean = cols.map((c) => c.trim());
            const existing = subjGrades[stu.id] || {};
            subjGrades[stu.id] = {
              ...existing,
              tx1: clean[0] ?? existing.tx1 ?? '',
              tx2: clean[1] ?? existing.tx2 ?? '',
              tx3: clean[2] ?? existing.tx3 ?? '',
              tx4: clean[3] ?? existing.tx4 ?? '',
              gk: clean[4] ?? existing.gk ?? '',
              ck: clean[5] ?? existing.ck ?? '',
              comment: clean[6] ?? existing.comment ?? '',
            };
          });

          return {
            ...prev,
            [activeClass]: {
              ...classGrades,
              [semester]: { ...semGrades, [selectedSubject]: subjGrades },
            },
          };
        });
        setGradePasteText('');
        setGradePasteModalOpen(false);
        showToast(`Đã dán điểm môn ${selectedSubject} (${semester}).`);
      };

      const handleAssignStudentToSeatSlot = (slotKey, colNum, targetStudentId) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (!targetStudentId) return s.deskSlot === slotKey ? { ...s, deskSlot: '' } : s;
            if (s.id === targetStudentId) return { ...s, deskSlot: slotKey, team: colNum };
            if (s.deskSlot === slotKey) return { ...s, deskSlot: '' };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
      };

      const handleSwapTwoDeskSlots = (slotA, colA, slotB, colB) => {
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((s) => {
            if (s.deskSlot === slotA) return { ...s, deskSlot: slotB, team: colB };
            if (s.deskSlot === slotB) return { ...s, deskSlot: slotA, team: colA };
            return s;
          });
          return { ...prev, [activeClass]: list };
        });
        showToast(`Đã đổi chỗ giữa ghế ${slotA} và ${slotB}.`);
      };

      const handleAutoArrangeDesks = () => {
        const { cols, desksPerCol, seatsPerDesk } = seatLayoutConfig;
        const slots = [];
        for (let r = 1; r <= desksPerCol; r++) {
          for (let c = 1; c <= cols; c++) {
            for (let s = 1; s <= seatsPerDesk; s++) {
              slots.push({ slotKey: `${c}-${r}-${s}`, col: c });
            }
          }
        }
        setStudentsByClass((prev) => {
          const list = (prev[activeClass] || []).map((stu, idx) => {
            const target = slots[idx];
            return target ? { ...stu, deskSlot: target.slotKey, team: target.col } : { ...stu, deskSlot: '' };
          });
          return { ...prev, [activeClass]: list };
        });
        showToast('Đã tự động xếp học sinh vào bàn!');
      };

      const exportClassCSV = () => {
        const headers = [
          'Mã định danh Bộ', 'Họ và tên', 'Ngày sinh', 'Giới tính', 'Tình trạng', 'Học nghề',
          'Chức vụ', 'Thái độ học tập', 'SĐT HS', 'SĐT PH', `Điểm Chuyên cần Tuần ${selectedWeek}`,
          ...currentSubjects.map((s) => `ĐTB ${s} (${semester})`), 'ĐTB Chung', 'Nhận xét GVCN',
        ];
        const rows = currentStudents.map((stu) => {
          const cond = calculateWeeklyConductScore(stu.id);
          const subjScores = currentSubjects.map((subj) => {
            const avg = calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? avg : '';
          });
          const gpa = getStudentOverallGPA(stu.id, 'SEMESTER') ?? '';
          return [
            `'${stu.moetId || stu.id}`, `"${stu.name}"`, stu.dob, stu.gender,
            `"${stu.status || 'Đang học'}"`, `"${stu.vocational || 'Chưa phân nghề'}"`,
            `"${stu.role}"`, `"${stu.attitude}"`, `'${stu.studentPhone}`, `'${stu.parentPhone}`,
            cond.score, ...subjScores, gpa, `"${(stu.gvcnComment || '').replace(/"/g, '""')}"`,
          ].join(',');
        });
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SoQuanLy_${activeClass}_${semester.replace(/\s+/g, '')}_${schoolYear.replace(/\s+/g, '')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Đã xuất file Excel (.CSV) lớp ${activeClass}.`);
      };

      const buildSmartPedagogicalComment = (stu, tone = aiTone, targetMode = aiTargetMode) => {
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa =
          targetMode === 'GVCN_YEAR'
            ? getStudentOverallGPA(stu.id, summaryPeriodMode)
            : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));

        const rolePart = stu.role && stu.role !== 'Thành viên' ? `Trên cương vị ${stu.role}, em luôn gương mẫu và trách nhiệm. ` : '';
        const attitudePart =
          stu.attitude === 'Rất tích cực' || stu.attitude === 'Tích cực'
            ? 'Trong giờ học, em có thái độ học tập sôi nổi, hăng hái phát biểu xây dựng bài'
            : stu.attitude === 'Chăm chỉ' || stu.attitude === 'Khá chú ý'
            ? 'Em có ý thức học tập nghiêm túc, ghi chép bài đầy đủ và lắng nghe giảng bài'
            : 'Em cần tập trung chú ý hơn trên lớp và chủ động hoàn thành bài tập về nhà';

        const conductPart =
          yearCond.absentK === 0 && yearCond.late === 0
            ? `, chuyên cần đạt ${yearCond.avgConductScore}đ (${yearCond.yearConductRank}, đi học đúng giờ, đầy đủ). `
            : `, điểm chuyên cần đạt ${yearCond.avgConductScore}đ (vắng ${yearCond.absentP}P/${yearCond.absentK}K, đi muộn ${yearCond.late} lần). `;

        let scorePart = 'Đang cập nhật điểm đánh giá định kỳ.';
        if (gpa !== null) {
          if (gpa >= 8.0) scorePart = `Kết quả học tập đạt mức Tốt (ĐTB ${gpa}), nắm vững kiến thức trọng tâm.`;
          else if (gpa >= 6.5) scorePart = `Kết quả học tập đạt mức Khá (ĐTB ${gpa}), cần rèn thêm kỹ năng giải bài tập nâng cao.`;
          else if (gpa >= 5.0) scorePart = `Kết quả học tập đạt mức Đạt (ĐTB ${gpa}), cần ôn luyện thêm để cải thiện điểm số.`;
          else scorePart = `Kết quả học tập hiện ở mức ${gpa}, cần phối hợp gia đình hỗ trợ củng cố kiến thức cơ bản.`;
        }

        if (tone === 'DETAILED_PARENT') {
          return `Kính gửi Phụ huynh em ${stu.name}: ${rolePart}${attitudePart}${conductPart}${scorePart} Rất mong gia đình tiếp tục đồng hành cùng giáo viên.`;
        }
        return `${rolePart}${attitudePart}${conductPart}${scorePart}`;
      };

      const handleGenerateAICommentForStudent = (stu) => {
        const comment = buildSmartPedagogicalComment(stu, aiTone, aiTargetMode);
        if (aiTargetMode === 'GVCN_YEAR') {
          handleUpdateStudentFieldInline(stu.id, 'gvcnComment', comment);
        } else {
          handleGradeChange(stu.id, 'comment', comment);
        }
        showToast(`Đã tạo nhận xét AI cho ${stu.name}.`);
      };

      const handleGenerateAICommentsForAll = () => {
        setAiGenerating(true);
        setTimeout(() => {
          if (aiTargetMode === 'GVCN_YEAR') {
            setStudentsByClass((prev) => ({
              ...prev,
              [activeClass]: (prev[activeClass] || []).map((stu) => ({
                ...stu,
                gvcnComment: buildSmartPedagogicalComment(stu, aiTone, 'GVCN_YEAR'),
              })),
            }));
          } else {
            currentStudents.forEach((stu) => {
              handleGradeChange(stu.id, 'comment', buildSmartPedagogicalComment(stu, aiTone, 'SUBJECT_COMMENT'));
            });
          }
          setAiGenerating(false);
          setAiModalOpen(false);
          showToast(`Đã tạo nhận xét AI cho cả lớp ${activeClass}!`);
        }, 250);
      };

      const handleCopyZaloReport = (stu) => {
        const cond = calculateWeeklyConductScore(stu.id);
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa = getStudentOverallGPA(stu.id, summaryPeriodMode);
        const wDateStr = currentWeekInfo.dateRange ? ` (${currentWeekInfo.dateRange})` : '';

        const subjectLines = currentSubjects
          .map((subj) => {
            const avg =
              summaryPeriodMode === 'WHOLE_YEAR'
                ? getSubjectWholeYearAvg(stu.id, subj)
                : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, subj, semester));
            return avg !== null ? `${subj}: ${avg}` : null;
          })
          .filter(Boolean)
          .join(' | ');

        const text = [
          `[THÔNG BÁO TÌNH HÌNH HỌC TẬP - ${schoolName.toUpperCase()}]`,
          `- Học sinh: ${stu.name} (Mã ĐD Bộ: ${stu.moetId || stu.id} - ${currentClassObj.name})`,
          `- Chuyên cần Tuần ${selectedWeek}${wDateStr} (${semester}): ${cond.score}/100đ (${cond.rank})`,
          `- Lũy kế chuyên cần năm: Vắng ${yearCond.absentP}P/${yearCond.absentK}K, Đi muộn ${yearCond.late} lần`,
          `- Điểm TB các môn: ${subjectLines || 'Đang cập nhật'}`,
          `- Điểm TB Chung: ${gpa ?? '--'} (${classifyAcademicRank(gpa)})`,
          `- Nhận xét của GV: ${stu.gvcnComment || buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}`,
          `Trân trọng, GV ${teacherName} (${AUTH_CONFIG.subNote})!`,
        ].join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        showToast(`Đã copy báo cáo Zalo của ${stu.name}!`);
      };

      const handlePickRandomStudent = () => {
        if (currentStudents.length === 0) return;
        let pool = currentStudents.filter((s) => !pickedHistoryIds.includes(s.id));
        if (pool.length === 0) {
          pool = [...currentStudents];
          setPickedHistoryIds([]);
        }
        if (prioritizePassive) {
          const weighted = [];
          pool.forEach((s) => {
            const weight = s.attitude === 'Còn thụ động' || s.attitude === 'Cần nhắc nhở' ? 3 : 1;
            for (let i = 0; i < weight; i++) weighted.push(s);
          });
          const chosen = weighted[Math.floor(Math.random() * weighted.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        } else {
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        }
      };

      const handleGenerateBalancedGroups = () => {
        const count = Math.max(2, Math.min(8, Number(groupCount) || 4));
        const sorted = [...currentStudents].sort((a, b) => {
          const gpaA = calculateSubjectAverage(getStudentSubjectScoreObj(a.id, selectedSubject, semester)) ?? 6.5;
          const gpaB = calculateSubjectAverage(getStudentSubjectScoreObj(b.id, selectedSubject, semester)) ?? 6.5;
          return gpaB - gpaA;
        });
        const buckets = Array.from({ length: count }, (_, idx) => ({
          id: idx + 1, name: `Nhóm Thực hành ${idx + 1}`, members: [],
        }));
        sorted.forEach((stu, idx) => {
          const bIdx = idx % count;
          buckets[bIdx].members.push({
            ...stu,
            isLeader: buckets[bIdx].members.length === 0,
            score: calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester)),
          });
        });
        setGeneratedGroups(buckets);
      };

      const handleDownloadBackupJSON = () => {
        const payload = {
          schoolName, semester, teacherName, mainSubject, schoolYear,
          archiveByYear, attendanceTypes, seatLayoutConfig, exportedAt: new Date().toISOString(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SaoLuu_SoQuanLyHS_${teacherName.replace(/\s+/g, '_')}_${schoolYear.replace(/\s+/g, '')}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Đã tải file Sao lưu (.JSON) về máy tính!');
      };

      const handleImportBackupJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && parsed.archiveByYear) {
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.semester) setSemester(parsed.semester);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.mainSubject) setMainSubject(parsed.mainSubject);
              if (parsed.schoolYear) setSchoolYear(parsed.schoolYear);
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.attendanceTypes) setAttendanceTypes(parsed.attendanceTypes);
              if (parsed.seatLayoutConfig) setSeatLayoutConfig(parsed.seatLayoutConfig);
              setBackupModalOpen(false);
              showToast('Đã khôi phục toàn bộ dữ liệu thành công!');
            }
          } catch (err) {
            showToast('File không đúng định dạng.');
          }
        };
        reader.readAsText(file);
      };

      const studentsToPrint = useMemo(() => {
        if (!printReportTarget || printReportTarget === 'SEATING_CHART') return currentStudents;
        if (printReportTarget === 'ALL') return currentStudents;
        return [printReportTarget];
      }, [printReportTarget, currentStudents]);

      const triggerPrintPDF = (target, type = 'CONDUCT_WEEKLY') => {
        setPrintReportTarget(target);
        setPrintReportType(type);
        setTimeout(() => {
          window.print();
        }, 250);
      };

      // ==========================================================================
      // MÀN HÌNH ĐĂNG NHẬP BẢO MẬT RIÊNG CHO GIÁO VIÊN
      // ==========================================================================
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#F7F6F2] text-[#1B3B48] flex flex-col justify-between">
            <header className="bg-[#1B3B48] text-[#F7F6F2] py-4 px-6 border-b border-[#5C7667]/40">
              <div className="max-w-5xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-[#5C7667] flex items-center justify-center font-extrabold text-sm text-white">
                    SỔ GV
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-bold text-white tracking-wide">
                      {teacherName}
                    </h1>
                    <p className="text-xs text-[#D8E2DC]">{AUTH_CONFIG.subNote} • Sổ Quản Lý Học Sinh</p>
                  </div>
                </div>
                <span className="text-xs text-[#E9C46A] font-semibold hidden sm:inline">
                  Cổng Quản Trị Giáo Viên Chủ Nhiệm & Bộ Môn
                </span>
              </div>
            </header>

            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 bg-white rounded-3xl border border-[#E2DFD7] shadow-lg overflow-hidden">
                <div className="lg:col-span-6 p-8 bg-[#EFECE6] flex flex-col justify-between space-y-6">
                  <div className="space-y-4">
                    <span className="inline-block px-3 py-1 rounded-full bg-[#1B3B48] text-white text-xs font-bold uppercase tracking-wider">
                      Hệ thống Quản lý Lớp học
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-[#1B3B48] leading-snug">
                      Sổ Theo Dõi Chuyên Cần,
                      <br />
                      Điểm Số & Đánh Giá Toàn Diện.
                    </h2>
                    <blockquote className="p-4 rounded-2xl bg-white border-l-4 border-[#5C7667] text-xs sm:text-sm italic text-[#1B3B48]/90 leading-relaxed">
                      "Quản lý khoa học từng buổi học từ Chủ nhật đến Thứ 7, tách bạch Học kỳ 1 & Học kỳ 2 và xuất phiếu báo cáo PDF chuẩn mực gửi Phụ huynh."
                    </blockquote>
                  </div>

                  <div className="space-y-1.5 text-xs text-[#5C7667] border-t border-[#DFDBD0] pt-4">
                    <div className="font-bold text-[#1B3B48]">Tính năng nâng cấp phiên bản mới:</div>
                    <p>• Quản lý tuần học tách riêng HKI (Tuần 1–18) & HKII (Tuần 19–35).</p>
                    <p>• Lịch tuần tính từ <strong>Chủ nhật tuần trước đến Thứ 7 tuần này</strong>, tự động điền ngày.</p>
                    <p>• Xuất file PDF khổ A4 trình bày gọn gàng, đầy đủ chữ ký Phụ huynh & GV.</p>
                  </div>
                </div>

                <div className="lg:col-span-6 p-8 bg-[#1B3B48] text-[#F7F6F2] flex flex-col justify-center space-y-6">
                  <div className="space-y-1">
                    <span className="text-xs font-bold uppercase tracking-widest text-[#E9C46A]">
                      Xác thực Quyền Giáo Viên
                    </span>
                    <h3 className="text-2xl font-bold text-white">Đăng nhập Sổ Quản Lý</h3>
                    <p className="text-xs text-gray-300">
                      Chỉ tài khoản Giáo viên được cấp quyền mới có thể truy cập và chỉnh sửa dữ liệu.
                    </p>
                  </div>

                  <form onSubmit={handleTeacherLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold mb-1.5 text-gray-200">
                        Email Giáo viên
                      </label>
                      <input
                        type="text"
                        required
                        value={loginAccountInput}
                        onChange={(e) => setLoginAccountInput(e.target.value)}
                        placeholder="anhduonganhtuan@gmail.com"
                        className="w-full px-4 py-3 rounded-xl bg-white text-[#1B3B48] text-sm font-medium focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold mb-1.5 text-gray-200">
                        Mã đăng nhập Giáo viên (Mặc định: 123456)
                      </label>
                      <input
                        type="password"
                        required
                        value={loginPinInput}
                        onChange={(e) => setLoginPinInput(e.target.value)}
                        placeholder="••••••"
                        className="w-full px-4 py-3 rounded-xl bg-white text-[#1B3B48] text-sm font-medium focus:outline-none"
                      />
                    </div>

                    {loginError && (
                      <div className="p-3 rounded-xl bg-red-500/20 border border-red-400/40 text-red-100 text-xs font-medium">
                        {loginError}
                      </div>
                    )}

                    <button
                      type="submit"
                      className="w-full bg-[#5C7667] hover:bg-[#4A6154] text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2"
                    >
                      <Lock className="w-4 h-4" />
                      <span>Mở khóa Sổ Quản Lý Học Sinh</span>
                    </button>
                  </form>
                </div>
              </div>
            </main>

            <footer className="bg-[#EFECE6] border-t border-[#DFDBD0] py-4 px-6 text-center text-xs text-[#5C7667]">
              <strong>{teacherName}</strong> ({AUTH_CONFIG.subNote}) • Hệ thống Sổ Quản Lý Học Sinh GVCN & GVBM
            </footer>
          </div>
        );
      }

      // ==========================================================================
      // GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP
      // ==========================================================================

          {/* MODAL AI NHẬN XÉT */}
          {aiModalOpen && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl w-full max-w-lg p-5 space-y-4 text-xs shadow-xl">
                <h3 className="font-bold text-sm text-[#1B3B48]">Trợ lý AI Nhận xét Tự động ({currentClassObj.name})</h3>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setAiTargetMode('GVCN_YEAR')} className={`p-2.5 rounded-xl border font-bold ${aiTargetMode === 'GVCN_YEAR' ? 'bg-[#1B3B48] text-white' : 'bg-[#FAF9F6]'}`}>
                    Nhận xét Tổng kết GVCN
                  </button>
                  <button onClick={() => setAiTargetMode('SUBJECT_COMMENT')} className={`p-2.5 rounded-xl border font-bold ${aiTargetMode === 'SUBJECT_COMMENT' ? 'bg-[#1B3B48] text-white' : 'bg-[#FAF9F6]'}`}>
                    Nhận xét Môn {selectedSubject}
                  </button>
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setAiModalOpen(false)} className="px-3 py-1.5 border rounded-lg">Đóng</button>
                  <button onClick={handleGenerateAICommentsForAll} className="px-4 py-1.5 bg-[#2C4A3E] text-white rounded-lg font-bold">
                    {aiGenerating ? 'Đang tạo...' : 'Tạo Nhận Xét Cho Cả Lớp'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL SAO LƯU */}
          {backupModalOpen && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 text-xs shadow-xl">
                <h3 className="font-bold text-sm text-[#1B3B48]">Sao lưu & Khôi phục Dữ liệu (.JSON)</h3>
                <div className="flex gap-2">
                  <button onClick={handleDownloadBackupJSON} className="flex-1 py-2 bg-[#1B3B48] text-white rounded-xl font-bold">
                    Tải File Sao Lưu (.JSON)
                  </button>
                  <label className="flex-1 py-2 bg-[#EFECE6] text-[#1B3B48] rounded-xl font-bold text-center cursor-pointer">
                    Khôi phục từ File
                    <input type="file" accept=".json" onChange={handleImportBackupJSON} className="hidden" />
                  </label>
                </div>
                <button onClick={() => setBackupModalOpen(false)} className="w-full py-1.5 border rounded-lg font-semibold">Đóng</button>
              </div>
            </div>
          )}

          {/* ===================================================================
              BẢN IN PDF CHUẨN KHỔ A4 GỌN GÀNG, ĐẸP MẮT (CHỦ NHẬT -> THỨ 7)
          =================================================================== */}
          <div className="hidden print-only w-full bg-white text-black">
            {printReportType === 'SEATING_CHART' ? (
              <div className="p-4 max-w-5xl mx-auto">
                <div className="flex justify-between items-center border-b-2 border-[#1B3B48] pb-2 mb-3">
                  <div>
                    <div className="text-xs font-bold uppercase text-[#1B3B48]">{schoolName}</div>
                    <div className="text-[11px]">Năm học: {schoolYear} • {semester}</div>
                  </div>
                  <div className="text-lg font-extrabold uppercase text-[#1B3B48]">
                    SƠ ĐỒ CHỖ NGỒI LỚP {currentClassObj.name.toUpperCase()}
                  </div>
                  <div className="text-right text-[11px]">
                    GV: <strong>{teacherName}</strong> ({AUTH_CONFIG.subNote})
                  </div>
                </div>
                <div className="border-2 border-[#1B3B48] bg-gray-100 py-1.5 text-center font-bold text-xs mb-3">
                  BẢNG LỚP & BÀN GIÁO VIÊN
                </div>
                <div className="grid grid-cols-4 gap-2.5">
                  {Array.from({ length: seatLayoutConfig.cols }, (_, cIdx) => cIdx + 1).map((colNum) => (
                    <div key={colNum} className="border border-[#1B3B48] p-1.5">
                      <div className="text-center font-bold text-[11px] bg-gray-100 py-0.5 mb-1.5">DÃY {colNum}</div>
                      <div className="space-y-1.5">
                        {Array.from({ length: seatLayoutConfig.desksPerCol }, (_, rIdx) => rIdx + 1).map((deskNum) => (
                          <div key={deskNum} className="border border-gray-400 p-1 text-[10px]">
                            <div className="font-bold text-gray-600 mb-0.5">Bàn {deskNum}</div>
                            <div className="grid grid-cols-2 gap-1">
                              {Array.from({ length: seatLayoutConfig.seatsPerDesk }, (_, sIdx) => sIdx + 1).map((seatPos) => {
                                const seated = currentStudents.find((s) => s.deskSlot === `${colNum}-${deskNum}-${seatPos}`);
                                return (
                                  <div key={seatPos} className="border border-gray-300 p-1 min-h-[28px] font-bold">
                                    {seated ? seated.name : <span className="text-gray-400 font-normal">Trống</span>}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : printReportType === 'CONDUCT_WEEKLY' ? (
              /* 1. PHIẾU BÁO CÁO NỀ NẾP & VI PHẠM TUẦN (GỌN ĐẸP 1 TRANG A4) */
              studentsToPrint.map((stu, idx) => {
                const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
                const yearCond = calculateYearAttendanceSummary(stu.id);
                const violationList = [];
                DAYS_OF_WEEK.forEach((d) => {
                  SESSIONS_OF_DAY.forEach((ses) => {
                    const codes = getStudentDaySessionCodes(stu.id, d.key, ses.key, selectedWeek);
                    codes.forEach((code) => {
                      const t = attendanceTypes.find((x) => x.id === code);
                      if (t?.points < 0) {
                        const dDate = currentWeekInfo.days?.[d.key] ? ` (${currentWeekInfo.days[d.key]})` : '';
                        violationList.push(`${d.label}${dDate} - ${ses.shortLabel}: ${t.label}`);
                      }
                    });
                  });
                });

                return (
                  <div
                    key={stu.id}
                    className={`max-w-3xl mx-auto text-[11px] leading-snug ${
                      idx < studentsToPrint.length - 1 ? 'page-break' : ''
                    }`}
                  >
                    {/* Quốc hiệu & Tên trường */}
                    <div className="flex justify-between items-start border-b-2 border-[#1B3B48] pb-2 mb-3">
                      <div>
                        <div className="font-bold uppercase text-[#1B3B48]">{schoolName}</div>
                        <div>Lớp: <strong>{currentClassObj.name}</strong> • Năm học: <strong>{schoolYear}</strong></div>
                      </div>
                      <div className="text-right">
                        <div className="font-bold uppercase">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                        <div className="italic text-[10px]">Độc lập - Tự do - Hạnh phúc</div>
                      </div>
                    </div>

                    <div className="text-center mb-3">
                      <div className="text-sm font-extrabold uppercase text-[#1B3B48]">
                        PHIẾU THÔNG BÁO CHUYÊN CẦN & NỀ NẾP TUẦN {selectedWeek} ({semester.toUpperCase()})
                      </div>
                      <div className="text-[11px] font-semibold text-gray-700 mt-0.5">
                        Thời gian: {currentWeekInfo.dateRange || 'Từ Chủ nhật tuần trước đến Thứ 7 tuần này'}
                      </div>
                    </div>

                    {/* Khung thông tin học sinh gọn gàng */}
                    <div className="grid grid-cols-3 gap-1.5 border border-[#1B3B48] bg-[#F7F6F2] p-2.5 mb-3">
                      <div>Họ và tên: <strong>{stu.name}</strong></div>
                      <div>Mã định danh Bộ: <strong>{stu.moetId || stu.id}</strong></div>
                      <div>Ngày sinh: <strong>{stu.dob}</strong> ({stu.gender})</div>
                      <div>Chức vụ: <strong>{stu.role}</strong></div>
                      <div>Học nghề: <strong>{stu.vocational || 'Chưa phân nghề'}</strong></div>
                      <div>SĐT Phụ huynh: <strong>{stu.parentPhone || '--'}</strong></div>
                    </div>

                    {/* Bảng 7 ngày từ Chủ nhật tuần trước đến Thứ 7 tuần này */}
                    <div className="mb-3">
                      <div className="font-bold uppercase text-[#1B3B48] mb-1">
                        I. Chi tiết Chuyên cần Buổi Sáng & Buổi Chiều (Chủ nhật → Thứ 7):
                      </div>
                      <table className="w-full border-collapse border border-[#1B3B48] text-[11px]">
                        <thead>
                          <tr className="bg-[#1B3B48] text-white">
                            <th className="py-1.5 px-2 text-center w-28">Thứ / Ngày</th>
                            <th className="py-1.5 px-2 text-left">Buổi Sáng</th>
                            <th className="py-1.5 px-2 text-left">Buổi Chiều</th>
                            <th className="py-1.5 px-2 text-center w-16">Điểm</th>
                          </tr>
                        </thead>
                        <tbody>
                          {DAYS_OF_WEEK.map((d) => {
                            const mCodes = getStudentDaySessionCodes(stu.id, d.key, 'S', selectedWeek);
                            const aCodes = getStudentDaySessionCodes(stu.id, d.key, 'C', selectedWeek);
                            let dPts = 0;
                            const fmt = (arr) =>
                              arr.map((c) => {
                                const t = attendanceTypes.find((x) => x.id === c);
                                const p = Number(t?.points || 0);
                                dPts += p;
                                return `${t ? t.label : c} (${p > 0 ? '+' : ''}${p}đ)`;
                              });
                            const mTxt = fmt(mCodes);
                            const aTxt = fmt(aCodes);
                            const dateLabel = currentWeekInfo.days?.[d.key];

                            return (
                              <tr key={d.key}>
                                <td className="py-1 px-2 text-center font-bold bg-gray-50">
                                  {d.label} {dateLabel ? `(${dateLabel})` : ''}
                                </td>
                                <td className="py-1 px-2">
                                  {mCodes.length === 0 ? 'Có mặt đầy đủ' : <strong>{mTxt.join('; ')}</strong>}
                                </td>
                                <td className="py-1 px-2">
                                  {aCodes.length === 0 ? 'Có mặt đầy đủ' : <strong>{aTxt.join('; ')}</strong>}
                                </td>
                                <td className="py-1 px-2 text-center font-bold">
                                  {mCodes.length + aCodes.length === 0 ? '0đ' : `${dPts > 0 ? '+' : ''}${dPts}đ`}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    {/* Kết quả & Lũy kế */}
                    <div className="border border-[#1B3B48] p-2.5 mb-3 bg-[#FAF9F6]">
                      <div className="grid grid-cols-3 gap-2 font-bold">
                        <div>Điểm Tuần {selectedWeek}: {weekCond.score} / 100đ</div>
                        <div>Xếp loại Tuần: {weekCond.rank}</div>
                        <div>Nghỉ tuần: {weekCond.totalAbsentP} phép / {weekCond.totalAbsentK} không phép</div>
                      </div>
                      <div className="text-[10px] text-gray-700 mt-1">
                        * Lũy kế cả năm: Vắng {yearCond.absentP}P / {yearCond.absentK}K, Đi muộn {yearCond.late} lần • Điểm rèn luyện TB năm: {yearCond.avgConductScore}đ ({yearCond.yearConductRank}).
                      </div>
                    </div>

                    {/* Nhận xét GV */}
                    <div className="border border-[#1B3B48] p-2.5 mb-4">
                      <div className="font-bold uppercase text-[#1B3B48] mb-0.5">
                        II. Nhận xét của Giáo viên & Nội dung phối hợp Gia đình:
                      </div>
                      <p>
                        {violationList.length === 0
                          ? `Tuần ${selectedWeek}, em ${stu.name} chấp hành tốt nội quy lớp học, không vi phạm kỷ luật, thái độ học tập ${stu.attitude.toLowerCase()}.`
                          : `Tuần ${selectedWeek}, em ${stu.name} cần khắc phục các nội dung sau: ${violationList.join('; ')}.`}
                        {stu.gvcnComment ? ` Ghi chú: ${stu.gvcnComment}` : ''}
                      </p>
                    </div>

                    {/* Chữ ký 2 bên */}
                    <div className="grid grid-cols-2 text-center pt-1">
                      <div className="pr-4">
                        <div className="font-bold uppercase">Ý KIẾN & CHỮ KÝ PHỤ HUYNH</div>
                        <div className="border-b border-dotted border-black mt-5"></div>
                        <div className="border-b border-dotted border-black mt-5"></div>
                        <div className="text-[10px] italic mt-8">(Ký và ghi rõ họ tên)</div>
                      </div>
                      <div>
                        <div className="italic text-[10px]">Ngày ..... tháng ..... năm 202...</div>
                        <div className="font-bold uppercase mt-0.5">GIÁO VIÊN CHỦ NHIỆM</div>
                        <div className="mt-14 font-bold">{teacherName} ({AUTH_CONFIG.subNote})</div>
                      </div>
                    </div>
                  </div>
                );
              })
            ) : (
              /* 2. PHIẾU BÁO ĐIỂM CÁC MÔN HỌC (GỌN ĐẸP 1 TRANG A4) */
              studentsToPrint.map((stu, idx) => {
                const gpaSem = getStudentOverallGPA(stu.id, 'SEMESTER');
                const gpaYear = getStudentOverallGPA(stu.id, 'WHOLE_YEAR');
                const yearCond = calculateYearAttendanceSummary(stu.id);
                const honor = getHonorTitle(gpaYear, yearCond.yearConductRank);

                return (
                  <div
                    key={stu.id}
                    className={`max-w-3xl mx-auto text-[11px] leading-snug ${
                      idx < studentsToPrint.length - 1 ? 'page-break' : ''
                    }`}
                  >
                    <div className="flex justify-between items-start border-b-2 border-[#1B3B48] pb-2 mb-3">
                      <div>
                        <div className="font-bold uppercase text-[#1B3B48]">{schoolName}</div>
                        <div>Lớp: <strong>{currentClassObj.name}</strong> • Năm học: <strong>{schoolYear}</strong> ({semester})</div>
                      </div>
                      <div className="text-right">
                        <div className="text-sm font-extrabold uppercase text-[#1B3B48]">
                          PHIẾU KẾT QUẢ HỌC TẬP & RÈN LUYỆN
                        </div>
                        <div>Giáo viên: <strong>{teacherName}</strong> ({AUTH_CONFIG.subNote})</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-1.5 border border-[#1B3B48] bg-[#F7F6F2] p-2.5 mb-3">
                      <div>Họ và tên: <strong>{stu.name}</strong></div>
                      <div>Mã định danh Bộ: <strong>{stu.moetId || stu.id}</strong></div>
                      <div>Ngày sinh: <strong>{stu.dob}</strong> ({stu.gender})</div>
                      <div>Học nghề: <strong>{stu.vocational || 'Chưa phân nghề'}</strong></div>
                      <div>Rèn luyện: <strong>{yearCond.yearConductRank} ({yearCond.avgConductScore}đ)</strong></div>
                      <div>Danh hiệu: <strong>{honor}</strong></div>
                    </div>

                    <table className="w-full border-collapse border border-[#1B3B48] text-[11px] mb-3">
                      <thead>
                        <tr className="bg-[#1B3B48] text-white">
                          <th className="py-1.5 px-2 text-left">Môn học</th>
                          <th className="py-1.5 px-1.5 text-center">TX1</th>
                          <th className="py-1.5 px-1.5 text-center">TX2</th>
                          <th className="py-1.5 px-1.5 text-center">TX3</th>
                          <th className="py-1.5 px-1.5 text-center">TX4</th>
                          <th className="py-1.5 px-1.5 text-center">GK</th>
                          <th className="py-1.5 px-1.5 text-center">CK</th>
                          <th className="py-1.5 px-2 text-center">ĐTB {semester}</th>
                          <th className="py-1.5 px-2 text-center">ĐTB Năm</th>
                          <th className="py-1.5 px-2 text-left">Nhận xét môn</th>
                        </tr>
                      </thead>
                      <tbody>
                        {currentSubjects.map((subj) => {
                          const sc = getStudentSubjectScoreObj(stu.id, subj, semester);
                          const avgSem = calculateSubjectAverage(sc);
                          const avgYr = getSubjectWholeYearAvg(stu.id, subj);
                          return (
                            <tr key={subj}>
                              <td className="py-1 px-2 font-bold">{subj}</td>
                              <td className="py-1 px-1.5 text-center">{sc.tx1 || '-'}</td>
                              <td className="py-1 px-1.5 text-center">{sc.tx2 || '-'}</td>
                              <td className="py-1 px-1.5 text-center">{sc.tx3 || '-'}</td>
                              <td className="py-1 px-1.5 text-center">{sc.tx4 || '-'}</td>
                              <td className="py-1 px-1.5 text-center">{sc.gk || '-'}</td>
                              <td className="py-1 px-1.5 text-center">{sc.ck || '-'}</td>
                              <td className="py-1 px-2 text-center font-bold">{avgSem ?? '-'}</td>
                              <td className="py-1 px-2 text-center font-bold">{avgYr ?? '-'}</td>
                              <td className="py-1 px-2">{sc.comment || ''}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>

                    <div className="flex justify-between font-bold border border-[#1B3B48] bg-[#FAF9F6] p-2 mb-3">
                      <span>Điểm TB {semester}: {gpaSem ?? '--'} ({classifyAcademicRank(gpaSem)})</span>
                      <span>Điểm TB Cả năm: {gpaYear ?? '--'} ({classifyAcademicRank(gpaYear)})</span>
                    </div>

                    <div className="border border-[#1B3B48] p-2.5 mb-4">
                      <div className="font-bold uppercase text-[#1B3B48] mb-0.5">Nhận xét tổng kết của Giáo viên:</div>
                      <p>{stu.gvcnComment || buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}</p>
                    </div>

                    <div className="grid grid-cols-2 text-center pt-1">
                      <div>
                        <div className="font-bold uppercase">Ý KIẾN PHỤ HUYNH HỌC SINH</div>
                        <div className="text-[10px] italic mt-12">(Ký và ghi rõ họ tên)</div>
                      </div>
                      <div>
                        <div className="font-bold uppercase">GIÁO VIÊN PHỤ TRÁCH</div>
                        <div className="mt-12 font-bold">{teacherName} ({AUTH_CONFIG.subNote})</div>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
