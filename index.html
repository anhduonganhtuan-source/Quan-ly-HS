    // HỆ THỐNG LƯU TRỮ KÉP DUNG LƯỢNG LỚN (INDEXED-DB + LOCALSTORAGE ĐỒNG BỘ)
    // ============================================================================
    const STORAGE_KEY = 'gv_student_app_v6_master';
    const IDB_NAME = 'GV_StudentManagement_LargeDB_v2';
    const IDB_STORE = 'workspace_store';
    const IDB_RECORD_KEY = 'primary_state';

    const loadSavedStateSync = () => {
      try {
        if (window.__EMBEDDED_INITIAL_STATE__ && !localStorage.getItem(STORAGE_KEY)) {
          return window.__EMBEDDED_INITIAL_STATE__;
        }
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && parsed.archiveByYear) {
          return parsed;
        }
      } catch (e) {
        console.error('Lỗi đọc dữ liệu đồng bộ:', e);
      }
      return null;
    };

    const openLargeDatabase = () => {
      return new Promise((resolve) => {
        if (typeof window === 'undefined' || !window.indexedDB) {
          resolve(null);
          return;
        }
        try {
          const request = window.indexedDB.open(IDB_NAME, 1);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    };

    const saveToLargeIndexedDB = async (payload) => {
      try {
        const db = await openLargeDatabase();
        if (!db) return false;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          store.put(payload, IDB_RECORD_KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    };

    const loadFromLargeIndexedDB = async () => {
      try {
        const db = await openLargeDatabase();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const req = store.get(IDB_RECORD_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    };

    // ============================================================================

    // ============================================================================
    const calculateSubjectAverage = (scoreObj) => {
      if (!scoreObj) return null;
      const txValues = ['tx1', 'tx2', 'tx3', 'tx4']
        .map((k) => parseFloat(scoreObj[k]))
        .filter((v) => !isNaN(v) && v >= 0 && v <= 10);
      const gk = parseFloat(scoreObj.gk);
      const ck = parseFloat(scoreObj.ck);

      const hasGK = !isNaN(gk) && gk >= 0 && gk <= 10;
      const hasCK = !isNaN(ck) && ck >= 0 && ck <= 10;

      if (txValues.length === 0 && !hasGK && !hasCK) return null;

      let totalScore = txValues.reduce((a, b) => a + b, 0);
      let totalWeight = txValues.length;

      if (hasGK) {
        totalScore += gk * 2;
        totalWeight += 2;
      }
      if (hasCK) {
        totalScore += ck * 3;
        totalWeight += 3;
      }

      if (totalWeight === 0) return null;
      return Number((totalScore / totalWeight).toFixed(1));
    };

      const buildSmartPedagogicalComment = (stu, tone = aiTone, targetMode = aiTargetMode) => {
        const yearCond = calculateYearAttendanceSummary(stu.id);
        const gpa =
          targetMode === 'GVCN_YEAR'
            ? getStudentOverallGPA(stu.id, summaryPeriodMode)
            : calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester));

        const rolePart =
          stu.role && stu.role !== 'Thành viên'
            ? `Trên cương vị ${stu.role}, em luôn gương mẫu và trách nhiệm với tập thể. `
            : '';

        let attitudePart = '';
        if (stu.attitude === 'Rất tích cực' || stu.attitude === 'Tích cực') {
          attitudePart = 'Trong giờ học, em có thái độ học tập sôi nổi, hăng hái phát biểu xây dựng bài';
        } else if (stu.attitude === 'Chăm chỉ' || stu.attitude === 'Khá chú ý') {
          attitudePart = 'Em có ý thức học tập nghiêm túc, ghi chép bài đầy đủ và lắng nghe giảng bài';
        } else {
          attitudePart = 'Em cần tập trung chú ý hơn trên lớp và chủ động hơn trong việc hoàn thành bài tập';
        }

        let conductPart = '';
        if (yearCond.absentK === 0 && yearCond.late === 0) {
          conductPart = `, chuyên cần đạt ${yearCond.avgConductScore}đ (${yearCond.yearConductRank}, đi học đúng giờ, đầy đủ). `;
        } else {
          conductPart = `, điểm chuyên cần đạt ${yearCond.avgConductScore}đ (vắng ${yearCond.absentP}P/${yearCond.absentK}K, đi muộn ${yearCond.late} lần - cần khắc phục để đi học chuyên cần hơn). `;
        }

        let scorePart = '';
        if (gpa !== null) {
          if (gpa >= 8.0) {
            scorePart = `Kết quả học tập đạt mức Tốt (ĐTB ${gpa}), nắm vững kiến thức trọng tâm và vận dụng linh hoạt.`;
          } else if (gpa >= 6.5) {
            scorePart = `Kết quả học tập đạt mức Khá (ĐTB ${gpa}), nắm được kiến thức cơ bản nhưng cần rèn thêm kỹ năng giải bài tập nâng cao.`;
          } else if (gpa >= 5.0) {
            scorePart = `Kết quả học tập đạt mức Đạt (ĐTB ${gpa}), cần dành thêm thời gian ôn luyện ở nhà để cải thiện điểm số.`;
          } else {
            scorePart = `Kết quả học tập hiện ở mức ${gpa}, thầy/cô và gia đình cần phối hợp sát sao hơn để hỗ trợ em củng cố kiến thức căn bản.`;
          }
        } else {
          scorePart = 'Đang cập nhật tiến độ điểm đánh giá định kỳ.';
        }

        if (tone === 'FORMAL_TT22') {
          return `${rolePart}${attitudePart}${conductPart}${scorePart}`;
        }
        if (tone === 'DETAILED_PARENT') {
          return `Kính gửi Phụ huynh em ${stu.name}: ${rolePart}${attitudePart}${conductPart}${scorePart} Rất mong gia đình tiếp tục đồng hành, khích lệ em phát huy trong giai đoạn tới.`;
        }
        return `${rolePart}${attitudePart}${conductPart}${scorePart} Chúc em luôn giữ vững sự tự tin và bứt phá mạnh mẽ hơn nữa!`;
      };

      const copyTextSafe = (text) => {

          navigator.clipboard.writeText(text).catch(() => {});
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }

        const text = [

      const handlePickRandomStudent = () => {
        if (currentStudents.length === 0) return;
        let pool = currentStudents.filter((s) => !pickedHistoryIds.includes(s.id));
        if (pool.length === 0) {
          pool = [...currentStudents];
          setPickedHistoryIds([]);
        }

        if (prioritizePassive) {
          const weighted = [];
          pool.forEach((s) => {
            const weight =
              s.attitude === 'Còn thụ động' || s.attitude === 'Cần nhắc nhở' ? 3 : 1;
            for (let i = 0; i < weight; i++) weighted.push(s);
          });
          const chosen = weighted[Math.floor(Math.random() * weighted.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        } else {
          const chosen = pool[Math.floor(Math.random() * pool.length)];
          setPickedStudent(chosen);
          setPickedHistoryIds((prev) => [...prev, chosen.id]);
        }
      };

      const handleGenerateBalancedGroups = () => {
        const count = Math.max(2, Math.min(8, Number(groupCount) || 4));
        const sorted = [...currentStudents].sort((a, b) => {
          const gpaA =
            calculateSubjectAverage(getStudentSubjectScoreObj(a.id, selectedSubject, semester)) ??
            getStudentOverallGPA(a.id, 'SEMESTER') ??
            6.5;
          const gpaB =
            calculateSubjectAverage(getStudentSubjectScoreObj(b.id, selectedSubject, semester)) ??
            getStudentOverallGPA(b.id, 'SEMESTER') ??
            6.5;
          return gpaB - gpaA;
        });

        const buckets = Array.from({ length: count }, (_, idx) => ({
          id: idx + 1,
          name: `Nhóm Thực hành ${idx + 1}`,
          members: [],
        }));

        sorted.forEach((stu, idx) => {
          const bucketIdx = idx % count;
          buckets[bucketIdx].members.push({
            ...stu,
            isLeader: buckets[bucketIdx].members.length === 0,
            score:
              calculateSubjectAverage(getStudentSubjectScoreObj(stu.id, selectedSubject, semester)) ??
              getStudentOverallGPA(stu.id, 'SEMESTER'),
          });
        });

        setGeneratedGroups(buckets);

      const handleImportBackupJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && parsed.archiveByYear) {
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.semester) setSemester(parsed.semester);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.mainSubject) setMainSubject(parsed.mainSubject);
              if (parsed.schoolYear) setSchoolYear(parsed.schoolYear);
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.attendanceTypes) setAttendanceTypes(parsed.attendanceTypes);
              setBackupModalOpen(false);
              showToast('Đã khôi phục toàn bộ dữ liệu từ file .JSON thành công!');
            } else {
              showToast('File không đúng định dạng sao lưu.');
            }
          } catch (err) {
            showToast('Không thể đọc file JSON. Vui lòng kiểm tra lại.');
          }
        };
        reader.readAsText(file);

      const handlePushToGitHubGist = async () => {
        if (!githubToken.trim()) {
          showToast('Vui lòng nhập GitHub Personal Access Token (quyền gist) trước.');
          return;
        }
        setCloudSyncLoading(true);
        try {
          const payload = {
            schoolName,
            semester,
            teacherName,
            mainSubject,
            schoolYear,
            archiveByYear,
            attendanceTypes,
            updatedAt: Date.now(),
          };
          const body = {
            description: `Dữ liệu Sổ Quản Lý Học Sinh - GV ${teacherName}`,
            public: false,
            files: {
              'gv_student_management_backup.json': {
                content: JSON.stringify(payload, null, 2),
              },
            },
          };

          const url = githubGistId.trim()
            ? `https://api.github.com/gists/${githubGistId.trim()}`
            : 'https://api.github.com/gists';
          const method = githubGistId.trim() ? 'PATCH' : 'POST';

          const res = await fetch(url, {
            method,
            headers: {
              Authorization: `token ${githubToken.trim()}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(body),
          });

          if (!res.ok) throw new Error('GitHub API Error');
          const data = await res.json();
          if (data.id) {
            setGithubGistId(data.id);
            showToast(`Đã đồng bộ lên GitHub Cloud thành công! Mã Gist: ${data.id}`);
          }
        } catch (err) {
          showToast('Lỗi đồng bộ GitHub Gist. Hãy kiểm tra lại Token (cần bật quyền "gist").');
        } finally {
          setCloudSyncLoading(false);
        }
      };

      const handlePullFromGitHubGist = async () => {
        if (!githubToken.trim() || !githubGistId.trim()) {
          showToast('Vui lòng nhập cả GitHub Token và Gist ID để tải dữ liệu về.');
          return;
        }
        setCloudSyncLoading(true);
        try {
          const res = await fetch(`https://api.github.com/gists/${githubGistId.trim()}`, {
            headers: {
              Authorization: `token ${githubToken.trim()}`,
              Accept: 'application/vnd.github+json',
            },
          });
          if (!res.ok) throw new Error('Failed to fetch Gist');
          const data = await res.json();
          const rawContent = data.files?.['gv_student_management_backup.json']?.content;
          if (rawContent) {
            const parsed = JSON.parse(rawContent);
            if (parsed.archiveByYear) {
              if (parsed.schoolName) setSchoolName(parsed.schoolName);
              if (parsed.semester) setSemester(parsed.semester);
              if (parsed.teacherName) setTeacherName(parsed.teacherName);
              if (parsed.mainSubject) setMainSubject(parsed.mainSubject);
              if (parsed.schoolYear) setSchoolYear(parsed.schoolYear);
              setArchiveByYear(parsed.archiveByYear);
              if (parsed.attendanceTypes) setAttendanceTypes(parsed.attendanceTypes);
              showToast('Đã tải và khôi phục dữ liệu từ GitHub Cloud thành công!');
            }
          }
        } catch (err) {
          showToast('Không thể tải dữ liệu từ GitHub Gist. Vui lòng kiểm tra Gist ID.');
        } finally {
          setCloudSyncLoading(false);

        const injectScript = `<script>window.__EMBEDDED_INITIAL_STATE__ = ${JSON.stringify(currentPayload)};<\/script>`;
        const finalHTML = '<!DOCTYPE html>\n' + docClone.replace('<head>', '<head>\n' + injectScript);
        const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';

        URL.revokeObjectURL(url);
        showToast('Đã tải xuống file index.html (chứa trọn bộ tính năng + dữ liệu hiện tại của bạn)!');

                              handleGradeChange(pickedStudent.id, 'tx1', sc);
                              showToast(
                                `Đã ghi điểm TX1 = ${sc} môn ${selectedSubject} cho ${pickedStudent.name}!`
                              );
                            }}
                            className="px-2.5 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-300 rounded font-bold"
                          >
                            Ghi {sc}đ TX
                          </button>
                        ))}
                      </div>
                    </>
                  ) : (
                    <div className="text-gray-500 py-4">
                      Nhấn nút "Quay ngẫu nhiên" bên dưới để chọn học sinh trả lời bài.
                    </div>
                  )}
                </div>

                <div className="flex justify-between items-center pt-2">
                  <span className="text-gray-500">
                    Đã gọi trong tiết: {pickedHistoryIds.length}/{currentStudents.length} HS
                  </span>
                  <button
                    onClick={handlePickRandomStudent}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold flex items-center gap-1.5"
                  >
                    <Shuffle className="w-4 h-4" />
                    Quay ngẫu nhiên
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CHIA NHÓM THỰC HÀNH */}
          {groupModalOpen && (
            <div className="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4 no-print">
              <div className="bg-white border border-gray-300 rounded w-full max-w-2xl p-5 space-y-4 text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-gray-200 pb-2.5">
                  <h3 className="font-bold text-sm text-gray-900">
                    Chia Nhóm Thực Hành / Thảo Luận Cân Bằng Năng Lực ({currentClassObj.name})
                  </h3>
                  <button
                    onClick={() => setGroupModalOpen(false)}
                    className="text-gray-400 hover:text-gray-700"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex items-center justify-between gap-2 bg-gray-50 p-3 rounded border border-gray-200">
                  <div className="flex items-center gap-2">
                    <span className="font-semibold">Số lượng nhóm:</span>
                    {[2, 3, 4, 6].map((n) => (
                      <button
                        key={n}
                        onClick={() => {
                          setGroupCount(n);
                          setTimeout(handleGenerateBalancedGroups, 10);
                        }}
                        className={`px-3 py-1 rounded border font-bold ${
                          groupCount === n
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'bg-white text-gray-700 border-gray-300'
                        }`}
                      >
                        {n} nhóm
                      </button>
                    ))}
                  </div>
                  <button
                    onClick={handleGenerateBalancedGroups}
                    className="px-3 py-1.5 bg-gray-900 text-white rounded font-semibold"
                  >
                    Phân bổ lại
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {generatedGroups.map((g) => (
                    <div key={g.id} className="p-3 border border-gray-200 rounded bg-white">
                      <div className="font-bold text-blue-800 border-b border-gray-100 pb-1.5 mb-2">
                        {g.name} ({g.members.length} thành viên)
                      </div>
                      <div className="space-y-1">
                        {g.members.map((m) => (
                          <div key={m.id} className="flex items-center justify-between">
                            <span>
                              {m.name}{' '}
                              {m.isLeader && (
                                <span className="px-1.5 py-0.5 bg-amber-50 text-amber-800 border border-amber-200 rounded text-[10px] font-bold">
                                  Nhóm trưởng
                                </span>
                              )}
                            </span>
                            <span className="text-gray-500 font-medium">
                              ĐTB: {m.score ?? '--'}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL CHUYỂN NĂM HỌC & LÊN LỚP TỰ ĐỘNG */}
          {yearModalOpen && (
            <div className="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4 no-print">
              <form
                onSubmit={handleCreateNewSchoolYear}
                className="bg-white border border-gray-300 rounded w-full max-w-md p-5 space-y-4 text-xs"
              >
                <div className="flex justify-between items-center border-b border-gray-200 pb-2.5">
                  <h3 className="font-bold text-sm text-gray-900">
                    Quản Lý Năm Học & Tự Động Lên Lớp
                  </h3>
                  <button
                    type="button"
                    onClick={() => setYearModalOpen(false)}
                    className="text-gray-400 hover:text-gray-700"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div>
                  <label className="block font-bold text-gray-700 mb-1.5">
                    Chuyển nhanh giữa các Năm học đã lưu:
                  </label>
                  <div className="flex flex-wrap gap-1.5">
                    {Object.keys(archiveByYear).map((y) => (
                      <button
                        key={y}
                        type="button"
                        onClick={() => {
                          setSchoolYear(y);
                          setYearModalOpen(false);
                          showToast(`Đã chuyển sang dữ liệu năm học ${y}.`);
                        }}
                        className={`px-3 py-1.5 rounded border font-semibold ${
                          schoolYear === y
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'bg-gray-50 text-gray-800 border-gray-300'
                        }`}
                      >
                        {y}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="border-t border-gray-200 pt-3 space-y-2.5">
                  <label className="block font-bold text-gray-700">
                    Khởi tạo Năm học mới (VD: 2027 - 2028):
                  </label>
                  <input
                    type="text"
                    value={newYearName}
                    onChange={(e) => setNewYearName(e.target.value)}
                    className="w-full px-3 py-1.5 border border-gray-300 rounded"
                  />
                  <label className="flex items-center gap-2 cursor-pointer bg-blue-50 p-2.5 rounded border border-blue-200">
                    <input
                      type="checkbox"
                      checked={promoteClassesMode}
                      onChange={(e) => setPromoteClassesMode(e.target.checked)}
                    />
                    <span className="text-blue-900 font-medium">
                      Tự động lên lớp từ năm học hiện tại (10A1 &rarr; 11A1, giữ nguyên danh sách HS & SĐT Phụ huynh, làm mới bảng điểm)
                    </span>
                  </label>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setYearModalOpen(false)}
                    className="px-3 py-1.5 border border-gray-300 rounded"
                  >
                    Đóng
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-1.5 bg-blue-600 text-white rounded font-semibold flex items-center gap-1"
                  >
                    <FolderPlus className="w-3.5 h-3.5" />
                    Tạo / Chuyển Năm Học
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL TRUNG TÂM SAO LƯU & ĐỒNG BỘ GITHUB CLOUD */}
          {backupModalOpen && (
            <div className="fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4 no-print">
              <div className="bg-white border border-gray-300 rounded w-full max-w-xl p-5 space-y-4 text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-gray-200 pb-2.5">
                  <div className="flex items-center gap-2">
                    <Database className="w-4 h-4 text-emerald-600" />
                    <h3 className="font-bold text-sm text-gray-900">
                      Trung Tâm Sao Lưu Dữ Liệu Lớn & Đồng Bộ Đám Mây GitHub
                    </h3>
                  </div>
                  <button
                    onClick={() => setBackupModalOpen(false)}
                    className="text-gray-400 hover:text-gray-700"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded flex items-center justify-between">
                  <div>
                    <div className="font-bold text-emerald-950">
                      Bộ nhớ Kép (IndexedDB + LocalStorage) đang hoạt động
                    </div>
                    <div className="text-emerald-800 mt-0.5">
                      Đã dùng: <strong>{storageStats.usedKB} KB</strong> / Dung lượng tối đa:{' '}
                      <strong>~{storageStats.quotaMB} MB</strong> (Lưu lần cuối lúc {storageStats.lastSavedTime})
                    </div>
                  </div>
                  <span className="px-2 py-1 bg-white border border-emerald-300 rounded font-bold text-emerald-800">
                    An toàn 100% khi F5
                  </span>
                </div>

                <div className="p-3.5 border border-gray-200 rounded space-y-2 bg-gray-50">
                  <div className="font-bold text-gray-900">
                    1. Sao lưu ra File (.JSON) hoặc Tải File HTML kèm sẵn dữ liệu
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={handleDownloadBackupJSON}
                      className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold flex items-center gap-1.5"
                    >
                      <Download className="w-3.5 h-3.5" />
                      Tải File Sao Lưu (.JSON)
                    </button>
                    <label className="px-3.5 py-2 bg-white border border-gray-300 hover:bg-gray-100 text-gray-800 rounded font-semibold flex items-center gap-1.5 cursor-pointer">
                      <Upload className="w-3.5 h-3.5 text-emerald-600" />
                      Khôi phục từ File (.JSON)
                      <input
                        type="file"
                        accept=".json"
                        onChange={handleImportBackupJSON}
                        className="hidden"
                      />
                    </label>
                    <button
                      onClick={handleDownloadCurrentHTMLWithEmbeddedData}
                      className="px-3.5 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded font-semibold flex items-center gap-1.5"
                    >
                      <Download className="w-3.5 h-3.5 text-emerald-400" />
                      Tải file index.html (Kèm dữ liệu hiện tại)
                    </button>
                  </div>
                </div>

                <div className="p-3.5 border border-gray-200 rounded space-y-2.5 bg-gray-50">
                  <div className="font-bold text-gray-900">
                    2. Đồng bộ Đám mây trực tiếp lên GitHub cá nhân (GitHub Gist Cloud)
                  </div>
                  <p className="text-gray-600">
                    Nếu bạn dùng web trên GitHub Pages ở nhiều máy (MacBook ở nhà, máy tính ở trường, iPad), bạn có thể nhập <strong>GitHub Token</strong> (quyền <code>gist</code>) để đẩy và kéo dữ liệu chỉ với 1 nút bấm:
                  </p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-semibold text-gray-700 mb-0.5">
                        GitHub Personal Access Token
                      </label>
                      <input
                        type="password"
                        placeholder="ghp_xxxxxxxxxxxx"
                        value={githubToken}
                        onChange={(e) => setGithubToken(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-white border border-gray-300 rounded"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-gray-700 mb-0.5">
                        Mã Gist ID (Tự điền sau lần lưu đầu tiên)
                      </label>
                      <input
                        type="text"
                        placeholder="Để trống nếu tạo mới..."
                        value={githubGistId}
                        onChange={(e) => setGithubGistId(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-white border border-gray-300 rounded"
                      />
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-1">
                    <button
                      onClick={handlePushToGitHubGist}
                      disabled={cloudSyncLoading}
                      className="px-3.5 py-1.5 bg-gray-900 hover:bg-gray-800 text-white rounded font-semibold"
                    >
                      {cloudSyncLoading ? 'Đang đồng bộ...' : 'Đẩy dữ liệu lên GitHub Cloud'}
                    </button>
                    <button
                      onClick={handlePullFromGitHubGist}
                      disabled={cloudSyncLoading}
                      className="px-3.5 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 text-gray-800 rounded font-semibold"
                    >
                      Tải dữ liệu từ GitHub Cloud về máy này
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CHẾ ĐỘ IN PHIẾU LIÊN LẠC / TỔNG KẾT PDF (MỖI TRANG A4 1 HỌC SINH) */}
          <div className="hidden print-only w-full bg-white text-black">
            {studentsToPrint.map((stu, idx) => {
              const weekCond = calculateWeeklyConductScore(stu.id, selectedWeek);
              const yearCond = calculateYearAttendanceSummary(stu.id);
              const gpaSem = getStudentOverallGPA(stu.id, 'SEMESTER');
              const gpaYear = getStudentOverallGPA(stu.id, 'WHOLE_YEAR');
              const honor = getHonorTitle(gpaYear, yearCond.yearConductRank);

              return (
                <div
                  key={stu.id}
                  className={`p-8 max-w-4xl mx-auto ${
                    idx < studentsToPrint.length - 1 ? 'page-break' : ''
                  }`}
                >
                  <div className="flex justify-between items-start border-b-2 border-black pb-4 mb-5">
                    <div>
                      <div className="text-xs font-bold uppercase">{schoolName}</div>
                      <div className="text-xs mt-0.5">
                        Năm học: <strong>{schoolYear}</strong> • {semester}
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-base font-bold uppercase">
                        PHIẾU THÔNG BÁO KẾT QUẢ HỌC TẬP & RÈN LUYỆN
                      </div>
                      <div className="text-xs mt-0.5">
                        Lớp: <strong>{currentClassObj.name}</strong> • GV phụ trách: <strong>{teacherName}</strong>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 text-xs border border-black p-3 mb-4">
                    <div>
                      Họ và tên: <strong>{stu.name}</strong> ({stu.id})
                    </div>
                    <div>
                      Ngày sinh: <strong>{stu.dob}</strong> ({stu.gender})
                    </div>
                    <div>
                      Chức vụ: <strong>{stu.role}</strong>
                    </div>
                    <div>
                      Thái độ học tập: <strong>{stu.attitude}</strong>
                    </div>
                    <div>
                      SĐT Phụ huynh: <strong>{stu.parentPhone || '--'}</strong>
                    </div>
                    <div>
                      Danh hiệu dự kiến: <strong>{honor}</strong>
                    </div>
                  </div>

                  <div className="mb-4">
                    <div className="text-xs font-bold uppercase mb-1.5">
                      I. Kết quả Chuyên cần & Rèn luyện kỷ luật
                    </div>
                    <div className="grid grid-cols-4 gap-2 text-xs border border-black p-2.5">
                      <div>
                        Điểm Tuần {selectedWeek}: <strong>{weekCond.score}/100đ ({weekCond.rank})</strong>
                      </div>
                      <div>
                        Điểm TB Cả năm: <strong>{yearCond.avgConductScore}/100đ ({yearCond.yearConductRank})</strong>
                      </div>
                      <div>
                        Số buổi nghỉ: <strong>{yearCond.absentP} có phép / {yearCond.absentK} không phép</strong>
                      </div>
                      <div>
                        Đi muộn / Phát biểu: <strong>{yearCond.late} lần muộn / {yearCond.plusCount} lượt khen</strong>
                      </div>
                    </div>
                  </div>

                  <div className="mb-4">
                    <div className="text-xs font-bold uppercase mb-1.5">
                      II. Bảng điểm Kiểm tra Đánh giá các môn học (Chuẩn CT GDPT 2018)
                    </div>
                    <table className="w-full border-collapse border border-black text-xs">
                      <thead>
                        <tr className="bg-gray-100">
                          <th className="border border-black py-1.5 px-2 text-left">Môn học</th>
                          <th className="border border-black py-1.5 px-2 text-center">TX1</th>
                          <th className="border border-black py-1.5 px-2 text-center">TX2</th>
                          <th className="border border-black py-1.5 px-2 text-center">TX3</th>
                          <th className="border border-black py-1.5 px-2 text-center">TX4</th>
                          <th className="border border-black py-1.5 px-2 text-center">Giữa kỳ</th>
                          <th className="border border-black py-1.5 px-2 text-center">Cuối kỳ</th>
                          <th className="border border-black py-1.5 px-2 text-center">ĐTB {semester}</th>
                          <th className="border border-black py-1.5 px-2 text-center">ĐTB Cả năm</th>
                          <th className="border border-black py-1.5 px-2 text-left">Nhận xét của GVBM</th>
                        </tr>
                      </thead>
                      <tbody>
                        {currentSubjects.map((subj) => {
                          const sc = getStudentSubjectScoreObj(stu.id, subj, semester);
                          const avgSem = calculateSubjectAverage(sc);
                          const avgYr = getSubjectWholeYearAvg(stu.id, subj);
                          return (
                            <tr key={subj}>
                              <td className="border border-black py-1.5 px-2 font-bold">{subj}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.tx1 || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.tx2 || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.tx3 || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.tx4 || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.gk || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center">{sc.ck || '-'}</td>
                              <td className="border border-black py-1.5 px-2 text-center font-bold">
                                {avgSem ?? '-'}
                              </td>
                              <td className="border border-black py-1.5 px-2 text-center font-bold">
                                {avgYr ?? '-'}
                              </td>
                              <td className="border border-black py-1.5 px-2">{sc.comment || ''}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                    <div className="flex justify-between text-xs font-bold mt-2">
                      <span>
                        Điểm TB các môn ({semester}): {gpaSem ?? '--'} ({classifyAcademicRank(gpaSem)})
                      </span>
                      <span>
                        Điểm TB Cả năm: {gpaYear ?? '--'} ({classifyAcademicRank(gpaYear)})
                      </span>
                    </div>
                  </div>

                  <div className="border border-black p-3 text-xs mb-6">
                    <div className="font-bold uppercase mb-1">
                      III. Nhận xét tổng hợp của Giáo viên & Khuyến nghị phối hợp:
                    </div>
                    <p className="leading-relaxed">
                      {stu.gvcnComment ||
                        buildSmartPedagogicalComment(stu, 'ENCOURAGING', 'GVCN_YEAR')}
                    </p>
                  </div>

                  <div className="grid grid-cols-2 text-xs text-center pt-2">
                    <div>
                      <div className="font-bold">Ý KIẾN CỦA PHỤ HUYNH HỌC SINH</div>
                      <div className="text-gray-500 italic mt-1">(Ký và ghi rõ họ tên)</div>
                    </div>
                    <div>
                      <div className="font-bold">GIÁO VIÊN PHỤ TRÁCH</div>
                      <div className="mt-12 font-bold">{teacherName}</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
